<!doctype html>
<meta charset="utf-8">
<title>规则面板 · 左右布局三版</title>
<style>
  :root{
    --bg:#fff; --bg-raised:#fbfbfa; --bg-panel:#f7f7f5; --bg-inset:#f1f1ef; --bg-hover:#efefed;
    --border:#ebebea; --border-strong:#d3d3d1;
    --text:#37352f; --text-dim:#5f5e5b; --text-faint:#9b9a97;
    --accent:#2383e2; --accent-soft:#e7f0f9; --warning:#cb6b16; --danger:#e03e3e; --surface:#fff;
  }
  [data-theme="dark"]{
    --bg:#191919; --bg-raised:#202020; --bg-panel:#262626; --bg-inset:#2e2e2e; --bg-hover:#2b2b2b;
    --border:#2f2f2f; --border-strong:#4a4a4a;
    --text:#d4d4d1; --text-dim:#a5a5a2; --text-faint:#767672;
    --accent:#4a9de8; --accent-soft:#1d3247; --warning:#e59a4a; --danger:#f06a6a; --surface:#202020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-panel);color:var(--text);
    font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:24px 28px 80px}
  h1{font-size:19px;font-weight:600;letter-spacing:-.2px}
  .lede{color:var(--text-dim);font-size:13px;margin-top:6px;max-width:920px;line-height:1.75}
  .lede b{color:var(--text)}
  header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
  header button{margin-left:auto;flex-shrink:0;background:var(--surface);color:var(--text);
    border:1px solid var(--border-strong);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}

  .board{display:flex;flex-direction:column;gap:34px}
  .row{display:flex;gap:26px;align-items:flex-start}
  .meta{flex:0 0 220px;padding-top:4px}
  .meta h2{font-size:13.5px;font-weight:600;margin-bottom:6px}
  .meta p{font-size:12px;color:var(--text-faint);line-height:1.7}
  .meta .good{color:var(--accent);font-size:11.5px;margin-top:7px;line-height:1.6}
  .meta .bad{color:var(--warning);font-size:11.5px;margin-top:4px;line-height:1.6}
  .stage{flex:0 0 560px;min-height:400px;display:flex;flex-direction:column}

  .composer{background:var(--bg);border:1px solid var(--border);border-radius:12px;position:relative;margin-top:auto}
  .ta{padding:12px 14px;color:var(--text-faint);font-size:14px;min-height:52px}
  .bar{display:flex;align-items:center;gap:6px;padding:0 8px 8px}
  .icon{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--text-faint)}
  .shield{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;
    border:0;background:transparent;cursor:pointer;font:inherit;font-size:12.5px;color:var(--text-faint)}
  .shield:hover,.shield.on{background:var(--bg-hover);color:var(--text)}
  .spacer{flex:1}
  .send{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center}

  .panel{position:absolute;bottom:calc(100% + 8px);left:8px;z-index:30;border-radius:12px;
    border:1px solid var(--border);background:var(--surface);display:flex;
    box-shadow:0 12px 34px rgba(15,15,15,.15),0 2px 6px rgba(15,15,15,.08);overflow:hidden}

  /* 左:模式 */
  .modes{flex:0 0 176px;padding:6px;border-right:1px solid var(--border);background:var(--bg-raised)}
  .mode{width:100%;display:flex;gap:7px;align-items:flex-start;padding:7px 8px;border:0;background:none;
    cursor:pointer;border-radius:8px;text-align:left;font:inherit}
  .mode:hover{background:var(--bg-hover)}
  .mode.sel{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .mode .tick{width:13px;flex-shrink:0;color:var(--accent);margin-top:2px}
  .mode b{display:block;font-size:12.5px;font-weight:500}
  .mode.danger b{color:var(--danger)}
  .mode span.h{display:block;font-size:11px;color:var(--text-faint);line-height:1.4;margin-top:1px}

  /* 右:规则 */
  .side{flex:1;min-width:0;display:flex;flex-direction:column}
  .sidehead{display:flex;align-items:center;gap:6px;padding:9px 12px 7px;border-bottom:1px solid var(--border)}
  .sidehead .t{font-size:12px;font-weight:600;flex:1}
  .sidehead .c{font-size:11px;color:var(--text-faint)}
  .list{flex:1;overflow-y:auto;padding:4px 0;min-height:0}
  .list::-webkit-scrollbar{width:0}

  .r{display:flex;gap:7px;align-items:flex-start;padding:6px 10px 6px 4px;position:relative}
  .r:hover{background:var(--bg-hover)}
  .r.drag{opacity:.35}
  .r.over::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;background:var(--accent);border-radius:2px}
  .grip{flex-shrink:0;width:16px;display:flex;justify-content:center;padding-top:3px;color:var(--text-faint);
    cursor:grab;opacity:0;transition:opacity .12s}
  .r:hover .grip{opacity:.75}
  .grip:active{cursor:grabbing}
  .cb{flex-shrink:0;margin-top:2px;width:14px;height:14px;border-radius:4px;border:1px solid var(--border-strong);
    display:grid;place-items:center;cursor:pointer;background:transparent;color:transparent;padding:0}
  .cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rb{min-width:0;flex:1}
  .rt{font-size:12.5px;line-height:1.45}
  .off .rt{color:var(--text-faint);text-decoration:line-through}
  .cond{margin-top:2px;font-size:11px;color:var(--text-faint);font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .soft{margin-top:2px;font-size:11px;color:var(--warning);display:flex;align-items:center;gap:4px}
  .acts{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .12s}
  .r:hover .acts{opacity:1}
  .acts button{width:20px;height:20px;border:0;background:none;border-radius:4px;cursor:pointer;
    color:var(--text-faint);display:grid;place-items:center;padding:0}
  .acts button:hover{background:var(--bg-inset);color:var(--text)}
  .acts button.del:hover{color:var(--danger)}
  .edit{width:100%;padding:3px 7px;border-radius:5px;border:1px solid var(--accent);
    background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;outline:none}

  .addrow{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
  .addrow input{flex:1;min-width:0;height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;outline:none}
  .addrow input:focus{border-color:var(--accent)}
  .addrow button{width:28px;height:28px;border:0;border-radius:6px;background:var(--accent);color:#fff;
    cursor:pointer;display:grid;place-items:center;padding:0}

  /* 底部固定编辑区(第三版) */
  .drawer{border-top:1px solid var(--border);background:var(--bg-raised);padding:9px 12px}
  .drawer .lbl{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .chip{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
    font-family:ui-monospace,Menlo,monospace}
  .chip.warn{background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning);font-family:inherit}
  .drow{display:flex;gap:6px;margin-top:8px}
  .drow button{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font:inherit;font-size:12px;cursor:pointer}
  .drow button.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .drow button.d{color:var(--danger);border-color:transparent;margin-left:auto}
  .locked{padding:16px 14px;font-size:12px;color:var(--text-faint);line-height:1.7;text-align:center}
  svg{display:block}
</style>

<header>
  <div>
    <h1>规则面板 · 左右布局三版</h1>
    <p class="lede">
      左边选模式,选到<b>「按照规则」</b>右边才展开规则区 —— 规则区有足够宽度同时放下
      <b>拖拽排序 · 开关 · 编辑 · 删除</b>。三版的差别在于<b>编辑放在哪</b>。
      全部可真点:拖行换序、点勾停用、改文字、删、加。
    </p>
  </div>
  <button onclick="document.documentElement.toggleAttribute('data-theme')">切换明暗</button>
</header>

<div class="board" id="board"></div>

<script>
const SEED = [
  { id:"1", text:"删我文档以外的东西之前先问我", on:true,  cond:["delete","~/Documents/**"], soft:false },
  { id:"2", text:"装任何软件包之前问一下",       on:true,  cond:["install"],               soft:false },
  { id:"3", text:"推代码到远端前必须确认",        on:true,  cond:["gitPush"],               soft:false },
  { id:"4", text:"别自作主张改我的配置文件",      on:false, cond:[],                        soft:true  },
];
const I = {
  tick:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  cb:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  grip:'<svg width="10" height="14" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.3"/><circle cx="7.5" cy="3" r="1.3"/><circle cx="2.5" cy="8" r="1.3"/><circle cx="7.5" cy="8" r="1.3"/><circle cx="2.5" cy="13" r="1.3"/><circle cx="7.5" cy="13" r="1.3"/></svg>',
  pen:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  del:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  warn:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  shield:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/></svg>',
  clip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.4 11.05 12.25 20.2a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66L9.4 17.4a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
  send:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/></svg>',
};
const MODES = [
  ["ask","逐步确认","每次调用都问"],
  ["rules","按照规则","命中规则才问"],
  ["skip","完全跳过","不问不拦"],
];

const S = {};
["A","B","C"].forEach((k) => S[k] = {
  rules: SEED.map((r) => ({ ...r })), mode:"rules", open:true,
  editing:null, selected:"1", draft:"", dragId:null, overId:null,
});

const condHtml = (r) => r.soft
  ? `<div class="soft">${I.warn} 只靠助手自觉,拦不住</div>`
  : `<div class="cond">${r.cond.join(" · ")}</div>`;

const modesCol = (k, s) => `<div class="modes">${MODES.map(([id,name,hint]) => `
  <button class="mode ${s.mode===id?'sel':''} ${id==='skip'?'danger':''}" data-k="${k}" data-act="mode" data-v="${id}">
    <span class="tick">${s.mode===id?I.tick:""}</span>
    <span><b>${name}</b><span class="h">${hint}</span></span>
  </button>`).join("")}</div>`;

const head = (s) => `<div class="sidehead"><span class="t">规则</span>
  <span class="c">${s.rules.filter(r=>r.on).length}/${s.rules.length} 启用 · 拖动排序</span></div>`;

const addRow = (k, s) => `<div class="addrow">
  <input data-k="${k}" data-act="draft" value="${s.draft.replace(/"/g,"&quot;")}" placeholder="什么情况下要先问过你…">
  <button data-k="${k}" data-act="add">${I.plus}</button></div>`;

const grip = (k, r) => `<span class="grip" draggable="true" data-k="${k}" data-drag="${r.id}">${I.grip}</span>`;
const cb = (k, r) => `<button class="cb ${r.on?'on':''}" data-k="${k}" data-act="on" data-id="${r.id}">${I.cb}</button>`;

const shell = (k, s, side, width) => `
  <div class="composer">
    ${s.open ? `<div class="panel" style="width:${width}px">${modesCol(k,s)}
      <div class="side">${s.mode==="rules" ? side : `<div class="locked">
        ${s.mode==="ask" ? "「逐步确认」下每次调用都会问你,规则用不上。" : "「完全跳过」下不问不拦,规则不生效。"}
        <br><br>切到<b style="color:var(--accent)">按照规则</b>来管理它们。</div>`}</div>
    </div>` : ""}
    <div class="ta">发送消息…</div>
    <div class="bar">
      <span class="icon">${I.clip}</span>
      <button class="shield ${s.open?'on':''}" data-k="${k}" data-act="toggle">${I.shield}
        ${s.mode==="rules" ? `${s.rules.filter(r=>r.on).length} 条规则` : MODES.find(m=>m[0]===s.mode)[1]}</button>
      <span class="spacer"></span>
      <span class="send">${I.send}</span>
    </div>
  </div>`;

// ── A:行内编辑(hover 出笔) ─────────────────────────────
function viewA(k, s) {
  const rows = s.rules.map((r) => s.editing === r.id
    ? `<div class="r"><span class="grip"></span><span style="width:14px"></span>
        <div class="rb"><input class="edit" data-k="${k}" data-act="commit" data-id="${r.id}" value="${r.text.replace(/"/g,"&quot;")}" autofocus></div></div>`
    : `<div class="r ${r.on?'':'off'} ${s.dragId===r.id?'drag':''} ${s.overId===r.id?'over':''}"
         data-k="${k}" data-drop="${r.id}">
        ${grip(k,r)}${cb(k,r)}
        <div class="rb"><div class="rt">${r.text}</div>${condHtml(r)}</div>
        <div class="acts">
          <button data-k="${k}" data-act="edit" data-id="${r.id}">${I.pen}</button>
          <button class="del" data-k="${k}" data-act="del" data-id="${r.id}">${I.del}</button>
        </div></div>`).join("");
  return shell(k, s, head(s) + `<div class="list">${rows}</div>` + addRow(k,s), 500);
}

// ── B:选中一条,底部抽屉编辑 ────────────────────────────
function viewB(k, s) {
  const cur = s.rules.find((r) => r.id === s.selected);
  const rows = s.rules.map((r) => `<div class="r ${r.on?'':'off'} ${s.dragId===r.id?'drag':''} ${s.overId===r.id?'over':''}"
      style="${r.id===s.selected?'background:var(--accent-soft)':''}"
      data-k="${k}" data-drop="${r.id}" data-act="select" data-id="${r.id}">
      ${grip(k,r)}${cb(k,r)}
      <div class="rb"><div class="rt">${r.text}</div>${condHtml(r)}</div>
    </div>`).join("");
  const drawer = !cur ? "" : `<div class="drawer">
      <div class="lbl">规则原话</div>
      <input class="edit" data-k="${k}" data-act="commit" data-id="${cur.id}" value="${cur.text.replace(/"/g,"&quot;")}">
      <div class="chips">${cur.soft
        ? `<span class="chip warn">${I.warn} 编译不出条件,拦不住</span>`
        : cur.cond.map((c)=>`<span class="chip">${c}</span>`).join("")}</div>
      <div class="drow">
        <button class="p" data-k="${k}" data-act="save" data-id="${cur.id}">保存并重新编译</button>
        <button class="d" data-k="${k}" data-act="del" data-id="${cur.id}">删除</button>
      </div></div>`;
  return shell(k, s, head(s) + `<div class="list" style="max-height:150px">${rows}</div>` + drawer + addRow(k,s), 520);
}

// ── C:三栏 —— 模式 / 列表 / 详情 ─────────────────────────
function viewC(k, s) {
  const cur = s.rules.find((r) => r.id === s.selected);
  const rows = s.rules.map((r) => `<div class="r ${r.on?'':'off'} ${s.dragId===r.id?'drag':''} ${s.overId===r.id?'over':''}"
      style="${r.id===s.selected?'background:var(--accent-soft)':''}"
      data-k="${k}" data-drop="${r.id}" data-act="select" data-id="${r.id}">
      ${grip(k,r)}${cb(k,r)}
      <div class="rb"><div class="rt">${r.text}</div></div>
    </div>`).join("");
  const side = `<div style="display:flex;flex:1;min-height:0">
      <div style="flex:0 0 210px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0">
        ${head(s)}<div class="list">${rows}</div>${addRow(k,s)}
      </div>
      <div style="flex:1;min-width:0;padding:11px 12px;display:flex;flex-direction:column">
        ${!cur ? `<div class="locked">左边选一条规则</div>` : `
          <div class="lbl" style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em">规则原话</div>
          <input class="edit" style="margin-top:4px" data-k="${k}" data-act="commit" data-id="${cur.id}" value="${cur.text.replace(/"/g,"&quot;")}">
          <div class="lbl" style="font-size:10.5px;color:var(--text-faint);margin-top:11px;text-transform:uppercase;letter-spacing:.04em">编译成的触发条件</div>
          <div class="chips">${cur.soft
            ? `<span class="chip warn">${I.warn} 拦不住</span>`
            : cur.cond.map((c)=>`<span class="chip">${c}</span>`).join("")}</div>
          <div class="drow" style="margin-top:auto">
            <button class="p" data-k="${k}" data-act="save" data-id="${cur.id}">保存并重新编译</button>
            <button class="d" data-k="${k}" data-act="del" data-id="${cur.id}">删除</button>
          </div>`}
      </div></div>`;
  return shell(k, s, side, 560);
}

const VIEWS = [
  ["A","① 左模式 + 右列表(行内编辑)",
    "规则区一列到底。拖拽手柄排序、勾选停用、hover 出笔与垃圾桶,点笔那行就地变输入框。",
    "最紧凑,一屏看完所有规则", "编辑时看不见它编译成了什么", viewA],
  ["B","② 左模式 + 右列表 + 底部抽屉",
    "上面是列表(可拖可勾),选中的那条在下方抽屉里编辑,编译条件就在编辑框下面。",
    "改完当场看见编译成什么;列表始终可见", "列表被压到 150px 高,规则多了要滚", viewB],
  ["C","③ 三栏:模式 / 列表 / 详情",
    "模式、规则列表、单条详情各占一栏。列表只显示原话(密度高),详情栏空间最足。",
    "空间最充足,列表与详情互不挤压", "面板宽到 560px,已接近一个小窗口", viewC],
];

function render() {
  document.getElementById("board").innerHTML = VIEWS.map(([k,title,desc,good,bad,fn]) => `
    <div class="row">
      <div class="meta"><h2>${title}</h2><p>${desc}</p>
        <div class="good">✓ ${good}</div><div class="bad">△ ${bad}</div></div>
      <div class="stage">${fn(k, S[k])}</div>
    </div>`).join("");
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { k, act, id, v } = el.dataset;
  const s = S[k]; if (!s) return;
  if (act === "mode") s.mode = v;
  if (act === "toggle") s.open = !s.open;
  if (act === "on") { const r = s.rules.find(x=>x.id===id); r.on = !r.on; e.stopPropagation(); }
  if (act === "edit") s.editing = id;
  if (act === "select") s.selected = id;
  if (act === "save") s.editing = null;
  if (act === "del") { s.rules = s.rules.filter(x=>x.id!==id); if (s.selected===id) s.selected = s.rules[0]?.id; }
  if (act === "add") {
    const text = s.draft.trim(); if (!text) return;
    s.rules.push({ id:String(Date.now()), text, on:true, cond:["(编译中…)"], soft:false });
    s.draft = "";
  }
  render();
});

document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { k, act, id } = el.dataset; const s = S[k]; if (!s) return;
  if (act === "draft") s.draft = el.value;
  if (act === "commit") { const r = s.rules.find(x=>x.id===id); if (r) r.text = el.value; }
});

document.addEventListener("keydown", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { k, act } = el.dataset; const s = S[k]; if (!s) return;
  if (e.key === "Enter" && act === "commit") { s.editing = null; render(); }
  if (e.key === "Enter" && act === "draft") {
    const text = s.draft.trim(); if (!text) return;
    s.rules.push({ id:String(Date.now()), text, on:true, cond:["(编译中…)"], soft:false });
    s.draft = ""; render();
  }
  if (e.key === "Escape") { s.editing = null; render(); }
});

// ── 拖拽排序 ────────────────────────────────────────────
document.addEventListener("dragstart", (e) => {
  const g = e.target.closest("[data-drag]"); if (!g) return;
  const s = S[g.dataset.k]; if (!s) return;
  s.dragId = g.dataset.drag;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", s.dragId);
});
document.addEventListener("dragover", (e) => {
  const row = e.target.closest("[data-drop]"); if (!row) return;
  const s = S[row.dataset.k]; if (!s || !s.dragId) return;
  e.preventDefault();
  if (s.overId !== row.dataset.drop) { s.overId = row.dataset.drop; render(); }
});
document.addEventListener("drop", (e) => {
  const row = e.target.closest("[data-drop]"); if (!row) return;
  const s = S[row.dataset.k]; if (!s || !s.dragId) return;
  e.preventDefault();
  const from = s.rules.findIndex((r) => r.id === s.dragId);
  const to = s.rules.findIndex((r) => r.id === row.dataset.drop);
  if (from > -1 && to > -1 && from !== to) {
    const [moved] = s.rules.splice(from, 1);
    s.rules.splice(to, 0, moved);
  }
  s.dragId = null; s.overId = null; render();
});
document.addEventListener("dragend", () => {
  for (const s of Object.values(S)) { s.dragId = null; s.overId = null; }
  render();
});

render();
</script>

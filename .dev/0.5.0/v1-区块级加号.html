<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench 0.5.0 · 交互 Demo</title>
<style>
  /* ── 与产品同一套 Notion 色板 ── */
  :root {
    color-scheme: light;
    --bg:#ffffff; --bg-raised:#fbfbfa; --bg-panel:#f7f7f5; --bg-inset:#f1f1ef; --bg-hover:#efefed;
    --border:#ebebea; --border-strong:#d3d3d1;
    --text:#37352f; --text-dim:#5f5e5b; --text-faint:#9b9a97;
    --accent:#2383e2; --accent-soft:#e7f0f9;
    --success:#0f7b6c; --warning:#cb6b16; --danger:#e03e3e;
    --surface:#ffffff;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg:#191919; --bg-raised:#202020; --bg-panel:#262626; --bg-inset:#2e2e2e; --bg-hover:#2b2b2b;
    --border:#2f2f2f; --border-strong:#4a4a4a;
    --text:#d4d4d1; --text-dim:#a5a5a2; --text-faint:#767672;
    --accent:#4a9de8; --accent-soft:#1d3247;
    --success:#4dab9a; --warning:#d9862f; --danger:#eb5757;
    --surface:#262626;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55; color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button { font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  input { font:inherit; color:var(--text); }
  ::selection { background:rgba(35,131,226,.18); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:transparent; border-radius:8px; }
  *:hover::-webkit-scrollbar-thumb { background:var(--border-strong); }

  .app { display:flex; height:100vh; overflow:hidden; }

  /* ── 侧边栏 ── */
  .sidebar {
    width:260px; flex-shrink:0; display:flex; flex-direction:column;
    background:var(--bg-raised); border-right:1px solid var(--border);
    margin-left:0; transition:margin-left .2s ease; position:relative;
  }
  .sidebar.closed { margin-left:-261px; }
  .brand { display:flex; align-items:center; gap:10px; padding:0 14px; height:44px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .brand .logo { font-size:20px; line-height:1; user-select:none; }
  .brand .name { font-size:17px; font-weight:600; flex:1; letter-spacing:-.01em; }
  .icon-btn {
    width:24px; height:24px; border-radius:4px; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); transition:background .1s,color .1s; flex-shrink:0; position:relative;
  }
  .icon-btn:hover { color:var(--text); background:var(--bg-hover); }
  .icon-btn.accent-hover:hover { color:var(--accent); }

  .side-tabs { display:flex; align-items:stretch; border-bottom:1px solid var(--border); flex-shrink:0; height:36px; position:relative; }
  .side-tab {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:13px; color:var(--text-dim); border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .1s,background .1s;
  }
  .side-tab:hover { color:var(--text); background:var(--bg-hover); }
  .side-tab.active { color:var(--text); font-weight:500; border-bottom-color:var(--accent); }
  .side-tabs .section-add { align-self:center; margin:0 6px 0 2px; }

  .rail { flex:1; overflow-y:auto; padding:4px 0; }
  .row {
    display:flex; align-items:center; gap:6px; padding:3px 10px; font-size:13.5px;
    cursor:pointer; user-select:none; color:var(--text); white-space:nowrap;
  }
  .row:hover { background:var(--bg-hover); }
  .row.sel { background:var(--bg-inset); }
  .row .ic { flex-shrink:0; display:flex; }
  .row .t { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .row .dot { width:6px; height:6px; border-radius:99px; background:var(--accent); flex-shrink:0; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .c-warning { color:var(--warning); } .c-accent { color:var(--accent); }
  .c-faint { color:var(--text-faint); } .c-success { color:var(--success); } .c-dim { color:var(--text-dim); }

  .filter-bar { display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .filter-bar input {
    flex:1; min-width:0; height:24px; padding:0 8px; border-radius:4px; border:none; outline:none;
    background:var(--bg-inset); font-size:12px;
  }
  .filter-bar input::placeholder { color:var(--text-faint); }

  .url-inline { display:flex; gap:4px; padding:4px 8px; }
  .url-inline input {
    flex:1; min-width:0; height:26px; padding:0 8px; font-size:12.5px; border-radius:4px;
    border:1px solid var(--accent); outline:none; background:var(--surface);
  }

  .side-footer { border-top:1px solid var(--border); padding:6px; display:flex; gap:4px; flex-shrink:0; }
  .side-footer button {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:6px 8px; border-radius:4px; font-size:13px; color:var(--text-dim);
  }
  .side-footer button:hover { background:var(--bg-hover); color:var(--text); }

  /* ── 主区 ── */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .tabbar {
    height:44px; display:flex; align-items:stretch; background:var(--bg-raised);
    border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar { display:none; }
  .nav-toggle {
    padding:0 10px; display:flex; align-items:center; color:var(--text-dim);
    border-right:1px solid var(--border); flex-shrink:0;
  }
  .nav-toggle:hover { color:var(--text); background:var(--bg-hover); }
  .tab {
    display:flex; align-items:center; gap:6px; padding:0 8px 0 12px; max-width:200px; min-width:0;
    font-size:13px; color:var(--text-dim); cursor:pointer; user-select:none;
    border-right:1px solid var(--border); border-top:2px solid transparent; flex-shrink:0;
  }
  .tab:hover { background:var(--bg-hover); color:var(--text); }
  .tab.active { background:var(--bg); color:var(--text); border-top-color:var(--accent); margin-top:-1px; padding-top:1px; }
  .tab .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .close { width:16px; height:16px; border-radius:3px; display:flex; align-items:center; justify-content:center; opacity:0; flex-shrink:0; }
  .tab:hover .close { opacity:.6; }
  .tab.active .close { opacity:.6; }
  .tab .close:hover { opacity:1 !important; background:var(--bg-inset); }
  .tab-plus {
    padding:0 9px; display:flex; align-items:center; color:var(--text-faint);
    flex-shrink:0; position:relative; gap:2px;
  }
  .tab-plus:hover { color:var(--accent); background:var(--bg-hover); }
  .tab-plus.at-end { margin-left:auto; border-left:1px solid var(--border); }
  .spacer { flex:1; }
  .side-toggle { padding:0 8px; display:flex; align-items:center; color:var(--text-faint); border-left:1px solid var(--border); flex-shrink:0; }
  .side-toggle:hover { color:var(--text); background:var(--bg-hover); }

  .content { flex:1; min-height:0; overflow-y:auto; background:var(--bg); display:flex; flex-direction:column; }

  /* 内容占位 */
  .chat-wrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  .chat-head { display:flex; align-items:center; gap:8px; padding:10px 18px; border-bottom:1px solid var(--border); }
  .chat-head .t { font-size:14px; font-weight:600; }
  .chip { font-size:11px; color:var(--text-faint); background:var(--bg-inset); border-radius:99px; padding:2px 8px; font-family:Menlo,monospace; }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:13px; flex-direction:column; gap:10px; }
  .chat-body .big { font-size:30px; opacity:.8; }
  .chat-input { margin:0 18px 16px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); display:flex; align-items:center; padding:10px 12px; gap:8px; }
  .chat-input input { flex:1; border:none; outline:none; background:none; font-size:14px; }
  .chat-input input::placeholder { color:var(--text-faint); }

  .web-toolbar { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); }
  .url-pill { flex:1; display:flex; align-items:center; gap:8px; background:var(--bg-inset); border-radius:99px; padding:5px 14px; font-size:12.5px; color:var(--text-dim); }
  .web-body { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:var(--text-faint); font-size:13px; }

  .favicon { width:16px; height:16px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex-shrink:0; }
  .favicon.lg { width:48px; height:48px; border-radius:12px; font-size:24px; }

  .file-body { font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:12.5px; padding:14px 0; color:var(--text-dim); }
  .file-body .ln { display:flex; gap:16px; padding:1px 18px; }
  .file-body .no { color:var(--text-faint); width:24px; text-align:right; user-select:none; }

  .term-body { flex:1; background:#1b1b1b; color:#d4d4d1; font-family:Menlo,monospace; font-size:12.5px; padding:14px 16px; }
  .term-body .p { color:#4dab9a; }

  /* ── 新标签页(方案 C)── */
  .launcher { flex:1; display:flex; align-items:center; justify-content:center; }
  .launcher-inner { width:min(560px,86%); display:flex; flex-direction:column; gap:14px; margin-top:-6vh; }
  .launcher-title { text-align:center; font-size:15px; color:var(--text-faint); user-select:none; }
  .omnibox {
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--border-strong); border-radius:12px; padding:13px 16px;
    box-shadow:0 4px 24px rgba(0,0,0,.05); transition:border-color .12s, box-shadow .12s;
  }
  .omnibox:focus-within { border-color:var(--accent); box-shadow:0 4px 24px rgba(35,131,226,.13); }
  .omnibox input { flex:1; border:none; outline:none; background:none; font-size:15px; }
  .omnibox input::placeholder { color:var(--text-faint); }
  .omni-kind { font-size:11px; color:var(--text-faint); background:var(--bg-inset); border-radius:4px; padding:2px 7px; white-space:nowrap; user-select:none; }
  .omni-kind.web { color:var(--accent); background:var(--accent-soft); }
  .launcher-hints { display:flex; justify-content:center; gap:8px; }
  .hint-chip {
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);
    border:1px solid var(--border); border-radius:99px; padding:5px 13px; transition:all .1s;
  }
  .hint-chip:hover { border-color:var(--border-strong); background:var(--bg-hover); color:var(--text); }
  .launcher-tip { text-align:center; font-size:11.5px; color:var(--text-faint); user-select:none; }
  .launcher-tip kbd { font-family:inherit; background:var(--bg-inset); border-radius:3px; padding:1px 5px; margin:0 1px; }

  /* ── 弹层 ── */
  #popover {
    position:fixed; z-index:80; min-width:180px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:4px;
    box-shadow:0 10px 34px rgba(0,0,0,.13);
  }
  .menu-item {
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:6px 10px; border-radius:5px; font-size:13px; color:var(--text);
  }
  .menu-item:hover { background:var(--bg-hover); }
  .menu-item .hint { margin-left:auto; font-size:11px; color:var(--text-faint); }
  .menu-divider { height:1px; background:var(--border); margin:4px 6px; }
  .pop-url { display:flex; gap:6px; padding:6px; }
  .pop-url input { width:220px; height:28px; padding:0 9px; font-size:13px; border-radius:5px; border:1px solid var(--border-strong); outline:none; background:var(--bg); }
  .pop-url input:focus { border-color:var(--accent); }
  .pop-url button { padding:0 12px; border-radius:5px; background:var(--accent); color:#fff; font-size:12.5px; }

  #toast {
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:90;
    background:var(--text); color:var(--bg); font-size:12.5px; border-radius:99px;
    padding:7px 16px; box-shadow:0 6px 20px rgba(0,0,0,.18); pointer-events:none;
    opacity:0; transition:opacity .18s;
  }
  #toast.show { opacity:.95; }

  /* ── 标注 ── */
  .anno-ring { outline:1.5px dashed var(--accent); outline-offset:2px; border-radius:6px; }
  .anno-badge {
    position:absolute; top:-7px; right:-7px; width:15px; height:15px; z-index:70;
    background:var(--accent); color:#fff; font-size:9.5px; font-weight:700;
    border-radius:99px; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }

  /* ── 控制面板 ── */
  #panel {
    position:fixed; right:16px; bottom:16px; z-index:100; width:250px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.15); font-size:12.5px; overflow:hidden;
  }
  #panel .head { display:flex; align-items:center; padding:9px 13px; font-weight:600; font-size:12.5px; border-bottom:1px solid var(--border); gap:7px; cursor:pointer; user-select:none; }
  #panel .head .ver { color:var(--text-faint); font-weight:400; }
  #panel .head .fold { margin-left:auto; color:var(--text-faint); }
  #panel .body { padding:10px 13px 12px; display:flex; flex-direction:column; gap:10px; }
  #panel.folded .body { display:none; }
  .pgroup .plabel { color:var(--text-faint); font-size:11px; margin-bottom:5px; }
  .opt { display:flex; align-items:flex-start; gap:7px; padding:4px 0; cursor:pointer; }
  .opt input { margin:2px 0 0; accent-color:var(--accent); }
  .opt .ot { flex:1; }
  .opt .ot b { font-weight:600; font-size:12.5px; }
  .opt .ot small { display:block; color:var(--text-faint); font-size:11px; line-height:1.45; }
  .opt .rec { font-size:10px; color:var(--accent); background:var(--accent-soft); border-radius:3px; padding:0 4px; margin-left:4px; }
  .seg { display:flex; background:var(--bg-inset); border-radius:6px; padding:2px; }
  .seg button { flex:1; padding:4px 0; border-radius:4px; font-size:12px; color:var(--text-dim); }
  .seg button.on { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.09); }
  .prow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .legend { color:var(--text-faint); font-size:11px; line-height:1.6; border-top:1px solid var(--border); padding-top:8px; }
  .legend b { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo">🌳</span>
      <span class="name">Workbench</span>
      <button class="icon-btn" id="btn-side-burger" data-act="toggle-sidebar" title="收起侧边栏"></button>
    </div>
    <div class="side-tabs" id="side-tabs"></div>
    <div id="side-body" style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>
    <div class="side-footer">
      <button data-act="noop" data-msg="演示:活动面板略"><span class="ic" data-ic="radio"></span>活动</button>
      <button data-act="noop" data-msg="演示:设置面板略"><span class="ic" data-ic="settings"></span>设置</button>
    </div>
  </aside>
  <div class="main">
    <div class="tabbar" id="tabbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="popover" hidden></div>
<div id="toast"></div>

<div id="panel">
  <div class="head" data-act="fold-panel">0.5.0 交互 Demo <span class="ver">方案切换</span><span class="fold" data-ic="chevron"></span></div>
  <div class="body">
    <div class="pgroup">
      <div class="plabel">③ 标签栏加号 — 点击行为</div>
      <label class="opt"><input type="radio" name="scheme" value="A">
        <span class="ot"><b>A · 一键对话</b><small>点 + 立即新建对话;右键 + 选其他类型</small></span></label>
      <label class="opt"><input type="radio" name="scheme" value="B">
        <span class="ot"><b>B · 类型菜单</b><small>点 + 弹出类型菜单,多一步但零歧义</small></span></label>
      <label class="opt"><input type="radio" name="scheme" value="C" checked>
        <span class="ot"><b>C · 新标签页</b><span class="rec">推荐</span><small>点 + 开新标签页,输入内容决定类型:文字→对话,网址→网站</small></span></label>
    </div>
    <div class="pgroup">
      <div class="plabel">加号位置</div>
      <div class="seg" id="seg-pos">
        <button data-pos="after" class="on">跟随标签</button>
        <button data-pos="end">栏最右</button>
      </div>
    </div>
    <div class="prow">
      <label class="opt" style="padding:0"><input type="checkbox" id="ck-anno" checked><span class="ot">标注变更点</span></label>
      <div class="seg" style="width:96px" id="seg-theme">
        <button data-th="light" class="on">亮</button>
        <button data-th="dark">暗</button>
      </div>
    </div>
    <div class="legend">
      <b>①</b> 侧栏右上 = 汉堡,只管侧栏收起<br>
      <b>②</b> 加号下沉到区块行,跟随区块才合层级<br>
      <b>③</b> 新标签入口移到标签栏,行为见方案
    </div>
  </div>
</div>

<script>
"use strict";
/* ───────── 图标(lucide 同款线稿) ───────── */
const ICONS = {
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  files:'<path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l5 5v9a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8M16 17H8"/>',
  terminal:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  panelRight:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  radio:'<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/>',

/* ───────── 小工具 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FAV_COLORS = ['#2383e2','#0f7b6c','#cb6b16','#9065b0','#e03e3e','#3d7a8c'];
const favColor = host => FAV_COLORS[[...host].reduce((a,c)=>a+c.charCodeAt(0),0) % FAV_COLORS.length];
const favicon = (url, lg=false) => {
  const host = String(url).replace(/^https?:\/\//,'').split('/')[0];
  const ch = (host.replace(/^www\./,'')[0]||'?').toUpperCase();
  return `<span class="favicon${lg?' lg':''}" style="background:${favColor(host)}">${esc(ch)}</span>`;
};
const isUrlish = v => /^[a-z][a-z0-9+.-]*:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);
const hostOf = v => String(v).replace(/^https?:\/\//,'').split('/')[0];

let toastTimer = null;
const toast = msg => {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
};

/* ───────── 弹层 ───────── */
const pop = $('#popover');
let popCleanup = null;
function openPop(html, anchor, opts={}) {
  closePop();
  pop.innerHTML = html;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let x = opts.alignRight ? r.right - w : r.left;
  let y = r.bottom + 6;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  if (y + h > innerHeight - 8) y = r.top - h - 6;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  const away = e => { if (!pop.contains(e.target)) closePop(); };
  setTimeout(() => document.addEventListener('pointerdown', away), 0);
  popCleanup = () => document.removeEventListener('pointerdown', away);
  pop.querySelector('input')?.focus();
}
function closePop() { pop.hidden = true; pop.innerHTML = ''; popCleanup?.(); popCleanup = null; }

/* ───────── 标签页操作 ───────── */
function openTab(tab, { focus=true } = {}) {
  S.tabs.push(tab);
  if (focus) S.activeTab = tab.id;
  render();
  return tab;
}
function closeTab(id) {
  const i = S.tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  S.tabs.splice(i, 1);
  if (S.activeTab === id) S.activeTab = (S.tabs[i] || S.tabs[i-1] || {}).id || null;
  render();
}
function newAgentTab(title) {
  const t = { id:nid('t'), kind:'agent', title: title || '未命名对话' };
  S.agents.unshift({ id:nid('a'), title:t.title });
  return openTab(t);
}
function newWebTab(input) {
  const host = hostOf(input);
  return openTab({ id:nid('t'), kind:'web', title:host.replace(/^www\./,''), url:host });
}
function newFileTab() { return openTab({ id:nid('t'), kind:'file', title:'未命名文件' }); }
function newTermTab() { return openTab({ id:nid('t'), kind:'terminal', title:'Terminal: workspace' }); }
function newLauncherTab() { return openTab({ id:nid('t'), kind:'newtab', title:'新标签页' }); }

/* 方案 B / 方案 A 右键:类型菜单 */

    <div class="menu-divider"></div>

    <button class="menu-item" data-pact="new-term"><span class="c-success">${icon('terminal',13)}</span>新建终端</button>
  `, anchor, { alignRight:true });
}
function urlPop(anchor) {
  openPop(`
    <div class="pop-url">
      <input id="pop-url-input" placeholder="example.com" spellcheck="false">
      <button data-pact="go-url">打开</button>
    </div>
  `, anchor, { alignRight:true });
}
pop.addEventListener('click', e => {
  const act = e.target.closest('[data-pact]')?.dataset.pact;
  if (!act) return;
  if (act === 'new-agent') { closePop(); newAgentTab(); }
  if (act === 'new-file')  { closePop(); newFileTab(); }
  if (act === 'new-term')  { closePop(); newTermTab(); }

/* 方案 C:新标签页(全能输入) */
function renderLauncher(el, tab) {
  el.innerHTML = `
    <div class="launcher">
      <div class="launcher-inner">
        <div class="launcher-title">开始一段对话,或打开一个网站</div>
        <div class="omnibox">
          <span class="c-faint" style="display:flex" id="omni-ic">${icon('bot',17)}</span>
          <input id="omni" placeholder="输入消息开启对话 · 输入网址打开网站" spellcheck="false" autocomplete="off">
          <span class="omni-kind" id="omni-kind">新对话</span>
        </div>
        <div class="launcher-hints">
          <button class="hint-chip" data-act="launch-file"><span class="c-faint" style="display:flex">${icon('file',13)}</span>新建文件</button>
          <button class="hint-chip" data-act="launch-term"><span class="c-success" style="display:flex">${icon('terminal',13)}</span>新建终端</button>
        </div>
        <div class="launcher-tip"><kbd>Enter</kbd> 开启(空输入 = 空白对话) · <kbd>Esc</kbd> 关闭此标签</div>
      </div>
    </div>`;
  const inp = $('#omni'), kind = $('#omni-kind'), ic = $('#omni-ic');
  const sync = () => {
    const web = isUrlish(inp.value.trim());
    kind.textContent = web ? '打开网站' : '新对话';
    kind.classList.toggle('web', web);
    ic.innerHTML = web ? icon('globe',17) : icon('bot',17);
    ic.className = web ? 'c-accent' : 'c-faint';
    ic.style.display = 'flex';
  };
  inp.addEventListener('input', sync);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeTab(tab.id); return; }
    if (e.key !== 'Enter') return;
    const v = inp.value.trim();
    // 就地转身:当前「新标签页」直接变成目标标签,位置不跳
    if (isUrlish(v)) {
      Object.assign(tab, { kind:'web', title:hostOf(v).replace(/^www\./,''), url:hostOf(v) });
    } else {
      const title = v ? (v.length > 14 ? v.slice(0,14) + '…' : v) : '未命名对话';
      Object.assign(tab, { kind:'agent', title });
      S.agents.unshift({ id:nid('a'), title });
    }
    render();
  });
  setTimeout(() => inp.focus(), 30);
}

/* ───────── 汇总渲染 ───────── */
const tabOf = title => S.tabs.find(t => t.kind === 'agent' && t.title === title);
function render() {
  $('#sidebar').classList.toggle('closed', !S.sidebarOpen);
  const burger = $('#btn-side-burger');
  burger.innerHTML = icon('menu',16) + (S.annotate ? '<span class="anno-badge">1</span>' : '');
  burger.classList.toggle('anno-ring', S.annotate);
  renderSideTabs();
  renderSideBody();
  renderTabbar();
  renderContent();
}

/* ───────── 事件委托 ───────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'toggle-sidebar') { S.sidebarOpen = !S.sidebarOpen; render(); return; }
  if (act === 'side-tab') { S.sideTab = btn.dataset.tab; S.siteAdding = false; render(); return; }

  if (act === 'section-add') {          // ② 区块级加号:跟随当前区块,层级自洽
    if (S.sideTab === 'agents') { newAgentTab(); return; }
    if (S.sideTab === 'sites')  { S.siteAdding = true; renderSideBody(); return; }
    openPop(`
      <button class="menu-item" data-pact-file="space"><span class="c-accent">${icon('folder',13)}</span>新建文件夹</button>
      <button class="menu-item" data-pact-file="file"><span class="c-faint">${icon('file',13)}</span>新建文件</button>
      <div class="menu-divider"></div>
      <button class="menu-item" data-pact-file="ws"><span class="c-accent">${icon('folder',13)}</span>添加工作区</button>
    `, btn, { alignRight:true });
    pop.querySelectorAll('[data-pact-file]').forEach(m => m.addEventListener('click', () => {
      const k = m.dataset.pactFile;
      closePop();
      if (k === 'file') newFileTab();
      else toast(k === 'ws' ? '演示:添加工作区略' : '演示:新建文件夹略');
    }));
    return;
  }

  if (act === 'tab-plus') {             // ③ 标签栏加号:三种方案
    if (S.scheme === 'A') { newAgentTab(); return; }
    if (S.scheme === 'B') { typeMenu(btn); return; }
    newLauncherTab();
    return;
  }

  if (act === 'tab') { S.activeTab = btn.dataset.id; render(); return; }
  if (act === 'tab-close') { e.stopPropagation(); closeTab(btn.dataset.id); return; }
  if (act === 'open-agent') {
    const title = btn.dataset.title;
    const existing = tabOf(title);
    existing ? (S.activeTab = existing.id, render()) : openTab({ id:nid('t'), kind:'agent', title });
    return;
  }
  if (act === 'open-site') {
    const url = btn.dataset.url;
    const existing = S.tabs.find(t => t.kind === 'web' && t.url === url);
    existing ? (S.activeTab = existing.id, render()) : newWebTab(url);
    return;
  }
  if (act === 'launch-file') { const t = S.tabs.find(x=>x.id===S.activeTab); if (t?.kind==='newtab') closeTab(t.id); newFileTab(); return; }
  if (act === 'launch-term') { const t = S.tabs.find(x=>x.id===S.activeTab); if (t?.kind==='newtab') closeTab(t.id); newTermTab(); return; }
  if (act === 'fold-panel') { $('#panel').classList.toggle('folded'); return; }
  if (act === 'noop') { toast(btn.dataset.msg || '演示占位'); return; }
});

/* 方案 A:右键加号 → 类型菜单;中键关标签 */
document.addEventListener('contextmenu', e => {
  const plus = e.target.closest('#tab-plus');
  if (plus && S.scheme === 'A') { e.preventDefault(); typeMenu(plus); }
});
document.addEventListener('auxclick', e => {
  if (e.button !== 1) return;
  const tab = e.target.closest('[data-act="tab"]');

});

$('#seg-pos').addEventListener('click', e => {
  const b = e.target.closest('[data-pos]'); if (!b) return;
  S.plusPos = b.dataset.pos;
  $('#seg-pos').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderTabbar();
});
$('#seg-theme').addEventListener('click', e => {
  const b = e.target.closest('[data-th]'); if (!b) return;
  document.documentElement.dataset.theme = b.dataset.th === 'dark' ? 'dark' : '';
  if (b.dataset.th !== 'dark') document.documentElement.removeAttribute('data-theme');
  $('#seg-theme').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
$('#ck-anno').addEventListener('change', e => { S.annotate = e.target.checked; render(); });

render();
</script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>Triforge 图标候选</title>
<style>
  :root{ --bg:#f2f2f4; --card:#fff; --text:#16161a; --dim:#6b6b76; --line:#e2e2e8; }
  body.dark{ --bg:#131317; --card:#1c1c22; --text:#ececf0; --dim:#9a9aa6; --line:#2c2c36; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:28px 32px 64px;}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px}
  button{margin-left:auto;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 13px}
  .big{display:flex;justify-content:center;margin-bottom:12px}
  .sizes{display:flex;align-items:flex-end;gap:12px;justify-content:center;
    padding:10px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
  .id{font-weight:600;font-size:13.5px}
  .note{color:var(--dim);font-size:12px;margin-top:2px}
  svg{display:block}
</style>
<header>
  <h1>Triforge 图标候选</h1>
  <span class="sub">三角之力 × 锻造台 · 报编号给我即可</span>
  <button onclick="document.body.classList.toggle('dark')">切换明暗</button>
</header>
<div class="sub" style="margin-top:6px">每张下方是 64 / 32 / 16 实际像素 —— <b>16px 还认得出来，才是能用的图标</b>。</div>
<div class="grid" id="grid"></div>
<script>
// 三角之力几何(512 画布)
const TRI = {
  top:  "M256 92 L338 232 L174 232 Z",
  bl:   "M170 240 L252 380 L88 380 Z",
  br:   "M342 240 L424 380 L260 380 Z",
  whole:"M256 92 L424 380 L88 380 Z",
};
const bg = (fill, r=112) => `<rect width="512" height="512" rx="${r}" fill="${fill}"/>`;

const icons = [
  { id:1, name:"经典三角 · 炉火", note:"最直白的三角之力,配色走锻造的热金而非任天堂金",
    svg:`${bg("url(#g1)")}
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2A1B12"/><stop offset="1" stop-color="#15100C"/></linearGradient>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD16B"/><stop offset="1" stop-color="#FF7A18"/></linearGradient></defs>
      <path d="${TRI.top}" fill="url(#h1)"/><path d="${TRI.bl}" fill="url(#h1)"/><path d="${TRI.br}" fill="url(#h1)"/>` },

  { id:2, name:"经典三角 · 浅色", note:"同构型的浅色版,白底应用里更精神",
    svg:`${bg("#FFF7EC")}
      <path d="${TRI.top}" fill="#E9701A"/><path d="${TRI.bl}" fill="#E9701A"/><path d="${TRI.br}" fill="#E9701A"/>` },

  { id:3, name:"经典三角 · 钢蓝", note:"冷色,更像开发工具,不像游戏",
    svg:`${bg("#0E1220")}
      <path d="${TRI.top}" fill="#6E9BFF"/><path d="${TRI.bl}" fill="#4C6FE8"/><path d="${TRI.br}" fill="#4C6FE8"/>` },

  { id:4, name:"实心大三角", note:"最简,16px 下最稳。放弃三分,只留一个烧红的三角",
    svg:`${bg("url(#g4)")}
      <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#241610"/><stop offset="1" stop-color="#120D0A"/></linearGradient>
      <linearGradient id="h4" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE08A"/><stop offset=".55" stop-color="#FF9022"/><stop offset="1" stop-color="#E4471B"/></linearGradient></defs>
      <path d="${TRI.whole}" fill="url(#h4)"/>` },

  { id:5, name:"线条三角", note:"单线勾勒,克制。小尺寸会变糊,先看看",
    svg:`${bg("#101014")}
      <path d="${TRI.whole}" fill="none" stroke="#F2A33C" stroke-width="26" stroke-linejoin="round"/>` },

  { id:6, name:"三块分离", note:"三块留缝 —— 三原生各自独立又拼成一个整体",
    svg:`${bg("#141019")}
      <g fill="#FFB347">
        <path d="M256 76 L346 232 L166 232 Z"/>
        <path d="M156 252 L246 396 L66 396 Z"/>
        <path d="M356 252 L446 396 L266 396 Z"/></g>` },

  { id:7, name:"三角 + 台面", note:"三角坐在一条台面线上 —— 工作台的意象",
    svg:`${bg("#12100E")}
      <path d="M256 108 L410 350 L102 350 Z" fill="url(#h7)"/>
      <rect x="72" y="374" width="368" height="34" rx="17" fill="#5A4634"/>
      <defs><linearGradient id="h7" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#FF8A2B"/></linearGradient></defs>` },

  { id:8, name:"三角 + 铁砧", note:"锻造感最强,细节多,小尺寸压力大",
    svg:`${bg("#15120F")}
      <path d="M256 92 L392 306 L120 306 Z" fill="#FFA834"/>
      <path d="M132 332 h248 l-30 40 h34 v40 h-256 v-40 h34 z" fill="#8B8B96"/>` },

  { id:9, name:"叠层三角", note:"三层错位,有厚度 —— 组件叠在原生之上",
    svg:`${bg("#0F1116")}
      <path d="M256 150 L420 402 L92 402 Z" fill="#3C4A6B"/>
      <path d="M256 118 L400 348 L112 348 Z" fill="#6C82BE"/>
      <path d="M256 86 L380 294 L132 294 Z" fill="#B9D0FF"/>` },

  { id:10, name:"负形三角", note:"三角是挖空的,底色透出来。最像现代 app 图标",
    svg:`${bg("url(#g10)")}
      <defs><linearGradient id="g10" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF9A2E"/><stop offset="1" stop-color="#E2542A"/></linearGradient>
        <mask id="m10"><rect width="512" height="512" fill="#fff"/>
        <path d="${TRI.top}" fill="#000"/><path d="${TRI.bl}" fill="#000"/><path d="${TRI.br}" fill="#000"/></mask></defs>
      <rect width="512" height="512" rx="112" fill="url(#g10)" mask="url(#m10)"/>` },

  { id:11, name:"火花三角", note:"三角上方一点火星,轻松一点",
    svg:`${bg("#16110D")}
      <path d="M256 150 L410 392 L102 392 Z" fill="#FF8C21"/>
      <circle cx="256" cy="96" r="26" fill="#FFD873"/>
      <circle cx="330" cy="128" r="11" fill="#FFD873" opacity=".8"/>
      <circle cx="182" cy="128" r="11" fill="#FFD873" opacity=".8"/>` },

  { id:12, name:"单色描边", note:"黑白极简,任何背景都不出错",
    svg:`${bg("#FFFFFF")}
      <path d="${TRI.top}" fill="#111"/><path d="${TRI.bl}" fill="#111"/><path d="${TRI.br}" fill="#111"/>` },
];

const render = (i) => {
  const at = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${i.svg}</svg>`;
  return `<div class="card">
    <div class="big">${at(128)}</div>
    <div class="sizes">${at(64)}${at(32)}${at(16)}</div>
    <div class="id">${i.id}. ${i.name}</div>
    <div class="note">${i.note}</div>
  </div>`;
};
document.getElementById("grid").innerHTML = icons.map(render).join("");
</script>

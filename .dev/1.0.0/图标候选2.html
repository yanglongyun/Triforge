<!doctype html>
<meta charset="utf-8">
<title>Triforge 图标候选 · 第二批</title>
<style>
  :root{ --bg:#f2f2f4; --card:#fff; --text:#16161a; --dim:#6b6b76; --line:#e2e2e8; }
  body.dark{ --bg:#121216; --card:#1b1b21; --text:#ececf0; --dim:#9a9aa6; --line:#2b2b34; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:28px 32px 64px;}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px}
  header button{margin-left:auto;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}

  /* Dock 模拟:图标是在 Dock 里被认出来的,不是在设计稿里 */
  .wall{margin-top:18px;border-radius:16px;padding:40px 16px 14px;display:flex;justify-content:center;
    background:linear-gradient(135deg,#432d63 0%,#232a52 45%,#101528 100%)}
  .dock{display:flex;gap:15px;align-items:flex-end;border-radius:22px;padding:11px 18px 6px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px)}
  .di{display:flex;flex-direction:column;align-items:center;gap:3px}
  .di svg{filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
  .di span{font-size:10px;color:rgba(255,255,255,.72)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px;margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 13px}
  .big{display:flex;justify-content:center;margin-bottom:12px}
  .big svg{filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
  .sizes{display:flex;align-items:flex-end;gap:12px;justify-content:center;
    padding:10px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
  .sizes svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
  .id{font-weight:600;font-size:13.5px}
  .note{color:var(--dim);font-size:12px;margin-top:2px}
  svg{display:block}
</style>
<body class="dark">
<header>
  <h1>Triforge 图标候选 · 第二批</h1>
  <span class="sub">十个方向而不是一个方向的十种颜色 · 报编号即可,配色可换</span>
  <button onclick="document.body.classList.toggle('dark')">切换明暗</button>
</header>
<div class="sub">上一批的问题:全是「字面三角」,而且三小角叠放就是塞尔达构图。这批分四路:<b>含义</b>(闭环/三格)、<b>锻造</b>(锻印/熔芯/砧上/锤印)、<b>几何</b>(琢面/三瓣/火口)、<b>气质</b>(燃灯)。下排 64/32/16 实际像素,16px 认得出才算数。三棱体另见 <b>三棱体研究.html</b>。</div>

<div class="wall"><div class="dock" id="dock"></div></div>
<div class="grid" id="grid"></div>

<script>
// ── 真·超椭圆底板(macOS 的连续曲率圆角,比 rx 圆角矩形柔和) ──
const SQ = (() => {
  const n = 4.7, pts = [];
  for (let i = 0; i < 96; i++) {
    const t = (i / 96) * Math.PI * 2;
    const c = Math.cos(t), s = Math.sin(t);
    const x = 256 + 254 * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const y = 256 + 254 * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return `M${pts.join("L")}Z`;
})();
const base = (fill) => `<path d="${SQ}" fill="${fill}"/>`;
// 圆角三角:fill+同色粗 stroke + round join,角自然变圆
const tri = (a, b, c, paint, w) =>
  `<path d="M${a} L${b} L${c} Z" fill="${paint}" stroke="${paint}" stroke-width="${w}" stroke-linejoin="round"/>`;
// 渐变一律 userSpaceOnUse,避免细长图形的包围盒退化
const lg = (id, x1, y1, x2, y2, stops) =>
  `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">` +
  stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ""}/>`).join("") +
  `</linearGradient>`;
const rg = (id, cx, cy, r, stops) =>
  `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}">` +
  stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ""}/>`).join("") +
  `</radialGradient>`;

const icons = [
  { id: 1, name: "锻印", note: "钢板上錾进一枚烧红的三角 —— 厂牌打在产品上的那一下。中灰底,在 Dock 一排深色图标里反而跳",
    svg: `<defs>${lg("a1", 0, 0, 0, 512, [[0, "#3B414D"], [1, "#1F232B"]])}${lg("a2", 0, 400, 0, 130, [[0, "#FFCB63"], [.5, "#FB8A22"], [1, "#E85D1A"]])}</defs>
      ${base("url(#a1)")}
      ${tri("256,120", "408,380", "104,380", "#14161B", 54)}
      ${tri("256,168", "365,356", "147,356", "url(#a2)", 30)}
      <path d="M130,398 L382,398" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".08"/>` },

  { id: 2, name: "闭环", note: "三段粗线围而不合 —— 对话·文件·网站,三件事转成一个工作闭环。这是产品含义本身,不借塞尔达",
    svg: `<defs>${lg("b1", 0, 100, 0, 420, [[0, "#FFC85C"], [1, "#F0691F"]])}</defs>
      ${base("#15121A")}
      <g stroke="url(#b1)" stroke-width="52" stroke-linecap="round" fill="none">
        <path d="M281,148 L399,352"/>
        <path d="M374,396 L138,396"/>
        <path d="M113,352 L231,148"/>
      </g>` },

  { id: 3, name: "琢面", note: "一个三角、三个琢面共用棱线 —— 三合一但不是三块拼贴。像宝石也像淬火的钢锭",
    svg: `<defs>${rg("c1", 256, 300, 300, [[0, "#241812"], [1, "#0E0B09"]])}</defs>
      ${base("url(#c1)")}
      <g stroke="#00000022" stroke-width="3" stroke-linejoin="round">
        <path d="M84,392 L256,100 L256,295 Z" fill="#FFC257"/>
        <path d="M256,100 L428,392 L256,295 Z" fill="#F98F24"/>
        <path d="M84,392 L428,392 L256,295 Z" fill="#D9531C"/>
      </g>` },

  { id: 4, name: "熔芯", note: "上一批 4 号的重做:热度从底部烧上来,身后有炉光。单形,16px 最稳的一档",
    svg: `<defs>${rg("d1", 256, 310, 250, [[0, "#FF7A1E", .38], [1, "#FF7A1E", 0]])}${lg("d2", 0, 392, 0, 116, [[0, "#FFEFB0"], [.45, "#FF9226"], [1, "#D8481E"]])}</defs>
      ${base("#0C0806")}
      <circle cx="256" cy="300" r="240" fill="url(#d1)"/>
      ${tri("256,118", "422,388", "90,388", "url(#d2)", 56)}` },

  { id: 5, name: "锤印 T", note: "Triforge 的 T 本身就是一把锤:钢头木柄,右上一粒火星。字符图标在 16px 存活率最高",
    svg: `<defs>${lg("e1", 0, 136, 0, 224, [[0, "#DDE3EE"], [1, "#96A0B4"]])}${lg("e2", 0, 210, 0, 406, [[0, "#C88C4C"], [1, "#7E5227"]])}</defs>
      ${base("#101318")}
      <rect x="132" y="136" width="248" height="88" rx="26" fill="url(#e1)"/>
      <rect x="228" y="210" width="56" height="196" rx="24" fill="url(#e2)"/>
      <path d="M404,80 l8,20 20,8 -20,8 -8,20 -8,-20 -20,-8 20,-8 Z" fill="#FFD673"/>` },

  { id: 6, name: "三瓣", note: "三片同形回旋 —— 三股力往一处拧。不含三角,却是最强的「三」;远看有动势",
    svg: `<defs>${rg("f1", 256, 256, 280, [[0, "#1A1520"], [1, "#0F0C13"]])}</defs>
      ${base("url(#f1)")}
      <defs><path id="petal" d="M256,256 C226,168 268,92 348,98 C382,168 338,246 262,264 Z"/></defs>
      <use href="#petal" fill="#FFC24E"/>
      <use href="#petal" transform="rotate(120 256 256)" fill="#F79E2C"/>
      <use href="#petal" transform="rotate(240 256 256)" fill="#E2701C"/>
      <circle cx="256" cy="256" r="24" fill="#0F0C13"/>` },

  { id: 7, name: "砧上", note: "一块钢板、一件烧红的活儿,活儿把光映在砧面上 —— 工作台叙事,细节只有两个形",
    svg: `<defs>${lg("g1", 0, 336, 0, 408, [[0, "#6A7383"], [1, "#454B58"]])}${lg("g2", 0, 304, 0, 140, [[0, "#FFB03A"], [1, "#F26A1B"]])}${rg("g3", 256, 340, 130, [[0, "#FF8E28", .5], [1, "#FF8E28", 0]])}</defs>
      ${base("#100D0B")}
      <ellipse cx="256" cy="340" rx="126" ry="20" fill="url(#g3)"/>
      ${tri("256,128", "366,304", "146,304", "url(#g2)", 44)}
      <rect x="100" y="336" width="312" height="72" rx="20" fill="url(#g1)"/>` },

  { id: 8, name: "火口", note: "整块热金属上冲出一个负形三角。Dock 上唯一的亮底图标最好认;16px 依然成立",
    svg: `<defs>${lg("h1", 0, 0, 512, 512, [[0, "#FFB63C"], [1, "#E2491D"]])}</defs>
      ${base("url(#h1)")}
      ${tri("256,146", "392,384", "120,384", "#1C120C", 44)}` },

  { id: 9, name: "三格", note: "产品长什么样,图标就长什么样:侧栏 + 双格工作区,会话那格是烧热的。最「工具软件」的一张",
    svg: `<defs>${lg("i1", 92, 0, 208, 0, [[0, "#FFB640"], [1, "#F07419"]])}</defs>
      ${base("#14161C")}
      <rect x="92" y="116" width="116" height="280" rx="20" fill="url(#i1)"/>
      <rect x="232" y="116" width="188" height="132" rx="20" fill="#8E97AB"/>
      <rect x="232" y="272" width="188" height="124" rx="20" fill="#5B6478"/>` },

  { id: 10, name: "燃灯", note: "暗房里点起的一小簇三角火,带光晕和飞屑 —— 不描述功能,只描述气质(Obsidian 思路)",
    svg: `<defs>${rg("j1", 256, 276, 210, [[0, "#FF8A25", .5], [1, "#FF8A25", 0]])}${lg("j2", 0, 346, 0, 186, [[0, "#FFD782"], [1, "#FF7E1D"]])}</defs>
      ${base("#0B0908")}
      <circle cx="256" cy="276" r="200" fill="url(#j1)"/>
      ${tri("256,190", "346,346", "166,346", "url(#j2)", 34)}
      <circle cx="352" cy="176" r="7" fill="#FFD980" opacity=".85"/>
      <circle cx="168" cy="198" r="5" fill="#FFD980" opacity=".7"/>
      <circle cx="310" cy="130" r="4" fill="#FFD980" opacity=".55"/>` },
];

const at = (i, px) => `<svg width="${px}" height="${px}" viewBox="0 0 512 512">${i.svg}</svg>`;

document.getElementById("dock").innerHTML = icons
  .map((i) => `<div class="di">${at(i, 52)}<span>${i.id}</span></div>`).join("");

document.getElementById("grid").innerHTML = icons
  .map((i) => `<div class="card">
    <div class="big">${at(i, 128)}</div>
    <div class="sizes">${at(i, 64)}${at(i, 32)}${at(i, 16)}</div>
    <div class="id">${i.id}. ${i.name}</div>
    <div class="note">${i.note}</div>
  </div>`).join("");
</script>
</body>

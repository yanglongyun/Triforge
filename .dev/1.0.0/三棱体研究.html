<!doctype html>
<meta charset="utf-8">
<title>Triforge 三棱体研究</title>
<style>
  :root{ --bg:#f2f2f4; --card:#fff; --text:#16161a; --dim:#6b6b76; --line:#e2e2e8; }
  body.dark{ --bg:#101014; --card:#191920; --text:#ececf0; --dim:#9a9aa6; --line:#2a2a33; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:28px 32px 64px;}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px}
  header button{margin-left:auto;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  .wall{margin-top:18px;border-radius:16px;padding:40px 16px 14px;display:flex;justify-content:center;
    background:linear-gradient(135deg,#1d2b4d 0%,#141b38 50%,#0b0f22 100%)}
  .dock{display:flex;gap:15px;align-items:flex-end;border-radius:22px;padding:11px 18px 6px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px)}
  .di{display:flex;flex-direction:column;align-items:center;gap:3px}
  .di svg{filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
  .di span{font-size:10px;color:rgba(255,255,255,.72)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px;margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 13px}
  .big{display:flex;justify-content:center;margin-bottom:12px}
  .big svg{filter:drop-shadow(0 10px 22px rgba(0,0,0,.4))}
  .sizes{display:flex;align-items:flex-end;gap:12px;justify-content:center;
    padding:10px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
  .sizes svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  .id{font-weight:600;font-size:13.5px}
  .note{color:var(--dim);font-size:12px;margin-top:2px}
  svg{display:block}
</style>
<body class="dark">
<header>
  <h1>三棱体研究 · 棱镜 × 光</h1>
  <span class="sub">构图与配色解耦 —— 报编号,或「X 的构图 + Y 的配色」混配</span>
  <button onclick="document.body.classList.toggle('dark')">切换明暗</button>
</header>
<div class="sub">五种构图:<b>三束</b>(一束进三束出,三 = 会话/文件/网站)、<b>光谱</b>(连续色散)、<b>立体棱柱</b>、<b>折线</b>(光在棱镜里拐的那一下)、<b>负形</b>。全冷色系。下排 64/32/16 实际像素。</div>

<div class="wall"><div class="dock" id="dock"></div></div>
<div class="grid" id="grid"></div>

<script>
// 超椭圆底板(macOS 连续曲率圆角)
const SQ = (() => {
  const n = 4.7, pts = [];
  for (let i = 0; i < 96; i++) {
    const t = (i / 96) * Math.PI * 2;
    const c = Math.cos(t), s = Math.sin(t);
    pts.push(`${(256 + 254 * Math.sign(c) * Math.pow(Math.abs(c), 2 / n)).toFixed(1)},${(256 + 254 * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)).toFixed(1)}`);
  }
  return `M${pts.join("L")}Z`;
})();
const lg = (id, x1, y1, x2, y2, stops) =>
  `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">` +
  stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ""}/>`).join("") + `</linearGradient>`;
const rg = (id, cx, cy, r, stops) =>
  `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${r}">` +
  stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ""}/>`).join("") + `</radialGradient>`;
const tri = (a, b, c, paint, w) =>
  `<path d="M${a} L${b} L${c} Z" fill="${paint}" stroke="${paint}" stroke-width="${w}" stroke-linejoin="round"/>`;
// 侧视棱镜的公共几何
const PT = "M256,124 L402,386 L110,386 Z";
const PRISM = (paint, w) => tri("256,124", "402,386", "110,386", paint, w);
const EDGE = (u) => `<path d="${PT}" fill="none" stroke="url(#${u}e)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M248,144 L128,376" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".22"/>
  <circle cx="256" cy="128" r="7" fill="#FFFFFF" opacity=".85"/>`;
const EDGE_DEF = (u) => lg(u + "e", 0, 120, 0, 390, [[0, "#FFFFFF", .8], [1, "#FFFFFF", .07]]);
const BEAM_IN = (u, color = "#F4F8FF") => lg(u + "bi", 12, 218, 204, 258, [[0, color, .03], [.6, color, .5], [1, color, .92]]);
const BEAM_IN_EL = (u) => `<polygon points="12,198 204,244 204,274 12,242" fill="url(#${u}bi)"/>
  <circle cx="188" cy="258" r="32" fill="url(#${u}gl)"/>`;
const GLOW_DEF = (u, color = "#FFFFFF") => rg(u + "gl", 188, 258, 34, [[0, color, .5], [1, color, 0]]);
const CLIP = (u) => `<clipPath id="${u}c"><path d="${SQ}"/></clipPath>`;

const icons = [
  { id: 1, name: "三束 · 靛蓝", note: "一束白光进,三束冷光出 —— 青/蓝/紫仍是「三」,对应三原生。开发工具气质最正的一张",
    svg: (u) => `<defs>${rg(u + "p", 256, 250, 330, [[0, "#141C34"], [1, "#0A0E1C"]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#46587F"], [1, "#1B2440"]])}${EDGE_DEF(u)}${BEAM_IN(u)}${GLOW_DEF(u)}
      ${lg(u + "b1", 338, 240, 500, 212, [[0, "#7DD3FC", .95], [1, "#7DD3FC", .6]])}
      ${lg(u + "b2", 338, 300, 500, 288, [[0, "#60A5FA", .95], [1, "#60A5FA", .6]])}
      ${lg(u + "b3", 338, 356, 500, 366, [[0, "#A78BFA", .95], [1, "#A78BFA", .6]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        ${BEAM_IN_EL(u)}
        <polygon points="338,302 500,342 500,388 338,318" fill="url(#${u}b3)"/>
        <polygon points="338,292 500,266 500,312 338,306" fill="url(#${u}b2)"/>
        <polygon points="338,282 500,190 500,236 338,296" fill="url(#${u}b1)"/>
        ${PRISM(`url(#${u}g)`, 30)}
        ${EDGE(u)}
      </g>` },

  { id: 2, name: "光谱 · 经典", note: "白光进、连续光谱出,棱镜近乎剪影 —— 就是那张专辑封面的构图,致敬还是避嫌,你定",
    svg: (u) => `<defs>${rg(u + "p", 256, 250, 330, [[0, "#17181D"], [1, "#0A0A0E"]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#2A2D3A"], [1, "#121420"]])}${EDGE_DEF(u)}${BEAM_IN(u)}${GLOW_DEF(u)}
      ${lg(u + "sp", 430, 150, 430, 410, [[0, "#FF5757", .9], [.2, "#FFA23E", .9], [.4, "#FFE45C", .9], [.6, "#4ADE80", .9], [.8, "#38BDF8", .9], [1, "#A78BFA", .9]])}${CLIP(u)}
      <filter id="${u}f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        ${BEAM_IN_EL(u)}
        <polygon points="336,278 502,150 502,410 336,320" fill="url(#${u}sp)" filter="url(#${u}f)"/>
        ${PRISM(`url(#${u}g)`, 30)}
        ${EDGE(u)}
      </g>` },

  { id: 3, name: "三束 · 极光", note: "紫水晶棱镜配极光三色(青/蓝/品红)—— 最「当代软件」的配色,Linear/Raycast 那一挂",
    svg: (u) => `<defs>${rg(u + "p", 256, 250, 330, [[0, "#1D1236"], [1, "#0D0819"]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#53407F"], [1, "#241944"]])}${EDGE_DEF(u)}${BEAM_IN(u, "#F3EEFF")}${GLOW_DEF(u, "#EADDFF")}
      ${lg(u + "b1", 338, 240, 500, 212, [[0, "#5EEAD4", .95], [1, "#5EEAD4", .6]])}
      ${lg(u + "b2", 338, 300, 500, 288, [[0, "#60A5FA", .95], [1, "#60A5FA", .6]])}
      ${lg(u + "b3", 338, 356, 500, 366, [[0, "#E879F9", .95], [1, "#E879F9", .6]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        ${BEAM_IN_EL(u)}
        <polygon points="338,302 500,342 500,388 338,318" fill="url(#${u}b3)"/>
        <polygon points="338,292 500,266 500,312 338,306" fill="url(#${u}b2)"/>
        <polygon points="338,282 500,190 500,236 338,296" fill="url(#${u}b1)"/>
        ${PRISM(`url(#${u}g)`, 30)}
        ${EDGE(u)}
        <circle cx="440" cy="164" r="4" fill="#BAF3E8" opacity=".7"/>
      </g>` },

  { id: 4, name: "晶柱 · 寒光", note: "立体三棱柱,冰玻璃里一团冷光,顶棱向外散三道 —— 有体积感的一张,16px 靠外轮廓撑",
    svg: (u) => `<defs>${rg(u + "p", 256, 240, 310, [[0, "#0E1424"], [1, "#080B12"]])}
      ${lg(u + "f1", 0, 150, 0, 398, [[0, "#3A4E6E"], [1, "#1B2740"]])}
      ${lg(u + "f2", 280, 126, 424, 356, [[0, "#2B3D5C"], [1, "#131D31"]])}
      ${rg(u + "core", 228, 330, 165, [[0, "#BFE3FF", .9], [.5, "#5E96D9", .45], [1, "#5E96D9", 0]])}
      ${rg(u + "gnd", 256, 408, 150, [[0, "#7DB8FF", .38], [1, "#7DB8FF", 0]])}${CLIP(u)}
      <clipPath id="${u}fc"><polygon points="216,168 360,398 88,398"/></clipPath>
      <filter id="${u}bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter></defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <ellipse cx="256" cy="408" rx="150" ry="17" fill="url(#${u}gnd)"/>
        <g stroke="#CFE6FF" stroke-linecap="round" fill="none">
          <path d="M280,126 L200,62" stroke-width="6" opacity=".4"/>
          <path d="M280,126 L306,54" stroke-width="6" opacity=".28"/>
          <path d="M280,126 L364,90" stroke-width="6" opacity=".33"/>
        </g>
        <circle cx="176" cy="96" r="4" fill="#CFE6FF" opacity=".5"/>
        <circle cx="336" cy="48" r="3.5" fill="#CFE6FF" opacity=".4"/>
        <polygon points="216,168 280,126 424,356 360,398" fill="url(#${u}f2)"/>
        <polygon points="216,168 360,398 88,398" fill="url(#${u}f1)"/>
        <g clip-path="url(#${u}fc)">
          <rect x="60" y="140" width="380" height="280" fill="url(#${u}core)"/>
          <circle cx="226" cy="344" r="40" fill="#E4F3FF" opacity=".9" filter="url(#${u}bl)"/>
        </g>
        <polygon points="216,168 280,126 424,356 360,398" fill="none" stroke="#C6DBF6" stroke-width="4" opacity=".35" stroke-linejoin="round"/>
        <polygon points="216,168 360,398 88,398" fill="none" stroke="#C6DBF6" stroke-width="4" opacity=".45" stroke-linejoin="round"/>
        <path d="M216,168 L280,126" stroke="#FFFFFF" stroke-width="5" opacity=".75" stroke-linecap="round"/>
      </g>` },

  { id: 5, name: "竖晶 · 极光", note: "立起来的棱柱,极光从晶体背后穿过 —— 玻璃里看得到透过来的光带。最有「气质」的一张",
    svg: (u) => `<defs>${rg(u + "p", 256, 240, 330, [[0, "#0C1020"], [1, "#07080F"]])}
      ${rg(u + "gnd", 256, 420, 140, [[0, "#8FA8FF", .3], [1, "#8FA8FF", 0]])}${CLIP(u)}
      <filter id="${u}bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter></defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <g fill="none" stroke-linecap="round" filter="url(#${u}bl)">
          <path d="M52,206 C160,176 340,248 462,196" stroke="#5EEAD4" stroke-width="26" opacity=".7"/>
          <path d="M44,262 C170,240 330,304 470,258" stroke="#60A5FA" stroke-width="26" opacity=".6"/>
          <path d="M56,318 C180,304 320,356 460,322" stroke="#E879F9" stroke-width="26" opacity=".55"/>
        </g>
        <ellipse cx="256" cy="420" rx="140" ry="15" fill="url(#${u}gnd)"/>
        <polygon points="256,86 316,130 196,130" fill="#2A3A5E" opacity=".95"/>
        <rect x="196" y="130" width="120" height="276" fill="#0F1830" fill-opacity=".55"/>
        <rect x="196" y="130" width="120" height="276" fill="none" stroke="#CFE0FF" stroke-width="4" opacity=".45"/>
        <polygon points="256,86 316,130 196,130" fill="none" stroke="#E2ECFF" stroke-width="4" opacity=".6" stroke-linejoin="round"/>
        <path d="M208,142 L208,396" stroke="#FFFFFF" stroke-width="7" opacity=".25" stroke-linecap="round"/>
        <circle cx="256" cy="88" r="6" fill="#FFFFFF" opacity=".85"/>
      </g>` },

  { id: 6, name: "折线 · 月白", note: "把「光在棱镜里拐的那一下」当主角:白光进,折一下,出来劈成蓝紫两根。近单色,最克制",
    svg: (u) => `<defs>${lg(u + "p", 0, 0, 0, 512, [[0, "#20242B"], [1, "#12151A"]])}
      ${lg(u + "s", 0, 124, 0, 386, [[0, "#F8FAFC"], [1, "#8B94A3"]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <path d="${PT}" fill="#FFFFFF" fill-opacity=".04" stroke="url(#${u}s)" stroke-width="16" stroke-linejoin="round"/>
        <path d="M56,214 L194,254" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity=".95"/>
        <path d="M194,254 L336,300" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".4"/>
        <path d="M336,300 L468,348" stroke="#7EB3FF" stroke-width="9" stroke-linecap="round" opacity=".95"/>
        <path d="M336,300 L452,384" stroke="#C5A3FF" stroke-width="9" stroke-linecap="round" opacity=".8"/>
        <circle cx="194" cy="254" r="10" fill="#FFFFFF" opacity=".9"/>
      </g>` },

  { id: 7, name: "负形 · 银", note: "唯一的亮底:银白台面嵌一块黑曜石棱镜,出射画成三根扁色条 —— 全场最平面构成,不玩光效",
    svg: (u) => `<defs>${lg(u + "p", 0, 0, 0, 512, [[0, "#F3F5F9"], [1, "#C9CFDA"]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#3C424E"], [1, "#22262E"]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <polygon points="20,228 184,252 184,272 20,250" fill="#9AA1AF"/>
        <polygon points="352,272 496,214 496,238 352,286" fill="#3B82F6"/>
        <polygon points="352,286 496,272 496,296 352,300" fill="#8B5CF6"/>
        <polygon points="352,300 496,330 496,354 352,314" fill="#EC4899"/>
        ${PRISM(`url(#${u}g)`, 30)}
        <path d="M256,124 L402,386" fill="none" stroke="#FFFFFF" stroke-width="6" opacity=".25" stroke-linecap="round"/>
      </g>` },

  { id: 8, name: "光雾 · 青碧", note: "出射是一整片翡翠色光雾而不是线 —— 散射感最足;绿是这个赛道没人用的颜色,好认",
    svg: (u) => `<defs>${rg(u + "p", 256, 250, 330, [[0, "#081713"], [1, "#040B09"]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#175447"], [1, "#0A2620"]])}${EDGE_DEF(u)}${BEAM_IN(u, "#EAFFF8")}${GLOW_DEF(u, "#D9FFF2")}
      ${lg(u + "m", 430, 150, 430, 410, [[0, "#A7F3D0", .7], [.5, "#34D399", .55], [1, "#0EA5E9", .5]])}${CLIP(u)}
      <filter id="${u}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="${u}f2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        ${BEAM_IN_EL(u)}
        <polygon points="330,278 502,150 502,410 330,320" fill="url(#${u}m)" filter="url(#${u}f)"/>
        <polygon points="336,288 502,258 502,300 336,308" fill="#B9FBE7" opacity=".5" filter="url(#${u}f2)"/>
        ${PRISM(`url(#${u}g)`, 30)}
        ${EDGE(u)}
        <circle cx="430" cy="180" r="4" fill="#B9FBE7" opacity=".6"/>
      </g>` },

  { id: 9, name: "琢面 · 冰", note: "琢面三角的冰色版:光源在体内,三个冰面滤出三档蓝,底边漏焦散 —— 承接你看过的 3 号构型",
    svg: (u) => `<defs>${rg(u + "p", 256, 270, 320, [[0, "#0E1526"], [1, "#070A12"]])}
      ${rg(u + "bg", 256, 300, 200, [[0, "#86B7FF", .5], [1, "#86B7FF", 0]])}
      ${rg(u + "core", 256, 288, 80, [[0, "#F2F8FF", .9], [1, "#F2F8FF", 0]])}
      ${rg(u + "cau", 256, 462, 130, [[0, "#93C5FD", .35], [1, "#93C5FD", 0]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <circle cx="256" cy="300" r="200" fill="url(#${u}bg)"/>
        <g stroke="#0B1220" stroke-opacity=".3" stroke-width="3" stroke-linejoin="round">
          <path d="M84,392 L256,100 L256,295 Z" fill="#C7DDFB" fill-opacity=".92"/>
          <path d="M256,100 L428,392 L256,295 Z" fill="#8FBBF7" fill-opacity=".92"/>
          <path d="M84,392 L428,392 L256,295 Z" fill="#3E7BE0" fill-opacity=".94"/>
        </g>
        <circle cx="256" cy="288" r="80" fill="url(#${u}core)"/>
        <path d="M256,100 L428,392 L84,392 Z" fill="none" stroke="#E4EEFF" stroke-width="5" opacity=".4" stroke-linejoin="round"/>
        <ellipse cx="256" cy="462" rx="120" ry="13" fill="url(#${u}cau)"/>
        <g stroke="#9CC4FF" stroke-width="10" stroke-linecap="round" opacity=".4">
          <path d="M200,402 L172,448"/><path d="M256,402 L256,452"/><path d="M312,402 L340,448"/>
        </g>
      </g>` },

  // ── 第二轮:视角 / 材质 / 光的关系 ──────────────────────────────
  { id: 10, name: "穿透 · 折光带", note: "光带打进来,在玻璃里拐弯、变色、再离开 —— 棱镜不发光,它改变经过它的东西。这正是产品干的事",
    svg: (u) => `<defs>${rg(u + "p", 256, 250, 330, [[0, "#101830"], [1, "#080C18"]])}
      ${lg(u + "r1", 14, 244, 207, 244, [[0, "#EAF4FF", .2], [1, "#EAF4FF", .85]])}
      ${lg(u + "r2", 207, 240, 387, 330, [[0, "#7DE3F4", .8], [1, "#8B7CF6", .85]])}
      ${lg(u + "r3", 370, 330, 502, 400, [[0, "#C77CF0", .85], [1, "#E66BD8", .45]])}
      ${lg(u + "g", 0, 124, 0, 386, [[0, "#2A3F6B", .58], [1, "#12203E", .68]])}${EDGE_DEF(u)}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">
        <polygon points="14,206 207,212 171,276 14,280" fill="url(#${u}r1)"/>
        <polygon points="207,212 354,302 387,360 171,276" fill="url(#${u}r2)"/>
        <polygon points="354,302 502,356 502,432 387,360" fill="url(#${u}r3)"/>
        ${PRISM(`url(#${u}g)`, 30)}
        ${EDGE(u)}
      </g>` },

  { id: 11, name: "无形 · 色散边", note: "玻璃本体几乎不画,只画棱边的色散镶边(品红/白/青)—— 相机镜头式的现代感,16px 是一枚彩边三角",
    svg: (u) => `<defs>${rg(u + "p", 256, 260, 330, [[0, "#101014"], [1, "#0A0A0D"]])}${CLIP(u)}</defs>
      <path d="${SQ}" fill="url(#${u}p)"/>
      <g clip-path="url(#${u}c)">

<!doctype html>
<meta charset="utf-8">
<title>会话列表 · 显示模式</title>
<style>
  :root{
    --bg:#fff; --bg-raised:#fbfbfa; --bg-panel:#f7f7f5; --bg-inset:#f1f1ef; --bg-hover:#efefed;
    --border:#ebebea; --border-strong:#d3d3d1;
    --text:#37352f; --text-dim:#5f5e5b; --text-faint:#9b9a97;
    --accent:#2383e2; --accent-soft:#e7f0f9;
    --success:#0f7b6c; --warning:#cb6b16; --danger:#e03e3e; --surface:#fff;
  }
  [data-theme="dark"]{
    --bg:#191919; --bg-raised:#202020; --bg-panel:#262626; --bg-inset:#2e2e2e; --bg-hover:#2b2b2b;
    --border:#2f2f2f; --border-strong:#4a4a4a;
    --text:#d4d4d1; --text-dim:#a5a5a2; --text-faint:#767672;
    --accent:#4a9de8; --accent-soft:#1d3247; --surface:#202020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg-panel); color:var(--text);
    font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    padding:24px 28px 64px;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:-.2px}
  .lede{color:var(--text-dim);font-size:13px;margin-top:6px;max-width:840px;line-height:1.7}
  .lede b{color:var(--text)}
  header{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
  header button{margin-left:auto;flex-shrink:0;background:var(--surface);color:var(--text);
    border:1px solid var(--border-strong);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}

  .board{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .col{flex:0 0 300px}
  .col > h2{font-size:13px;font-weight:600;margin-bottom:3px}
  .col > p{font-size:12px;color:var(--text-faint);line-height:1.6;margin-bottom:9px;min-height:32px}

  /* ── 侧栏仿真 ───────────────────────────────── */
  .rail{background:var(--bg-raised);border:1px solid var(--border);border-radius:9px;
    overflow:hidden;display:flex;flex-direction:column;height:454px}
  .rail-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
  .rail-tabs span{flex:1;text-align:center;padding:9px 4px;font-size:13px;color:var(--text-dim);
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .rail-tabs span.on{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}
  .list{flex:1;overflow-y:auto;padding:4px 0}
  .list::-webkit-scrollbar{width:0}

  .newrow{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 12px;
    color:var(--text-faint);font-size:13.5px;cursor:pointer}
  .newrow:hover{background:var(--bg-hover);color:var(--text)}

  /* 分组头 —— 显示模式的控制点就放这儿 */
  .grouphead{display:flex;align-items:center;gap:6px;padding:8px 8px 4px 12px;
    font-size:11px;font-weight:500;color:var(--text-faint);user-select:none}
  .grouphead .sp{flex:1}
  .gbtn{width:20px;height:20px;border:0;border-radius:4px;background:transparent;cursor:pointer;
    color:var(--text-faint);display:grid;place-items:center}
  .gbtn:hover{background:var(--bg-hover);color:var(--text)}
  .gbtn.on{color:var(--accent)}

  /* 会话行 */
  .row{display:flex;gap:7px;padding:4px 8px 4px 12px;cursor:pointer;align-items:flex-start}
  .row:hover{background:var(--bg-hover)}
  .row.sel{background:var(--bg-inset)}
  .ico{flex-shrink:0;width:14px;height:14px;margin-top:2px;color:var(--warning)}
  .body{min-width:0;flex:1}
  .titleline{display:flex;align-items:center;gap:6px}
  .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  .when{flex-shrink:0;font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--text-faint);margin-top:1px}
  .sub .who{color:var(--text-dim)}
  .dir{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text-faint);
    margin-top:2px;font-family:"SF Mono",Menlo,monospace}
  .snippet{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dot{flex-shrink:0;width:6px;height:6px;border-radius:99px;margin-top:6px}
  .dot.live{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
  .dot.unread{background:var(--success)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* 模式菜单 */
  .menuwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:172px;
    background:var(--surface);border:1px solid var(--border);border-radius:7px;
    box-shadow:0 6px 20px rgba(15,15,15,.13),0 2px 4px rgba(15,15,15,.08);padding:4px 0}
  .menu button{width:100%;display:flex;align-items:center;gap:9px;padding:6px 11px;background:none;
    border:0;cursor:pointer;font-size:13px;color:var(--text);text-align:left;font-family:inherit}
  .menu button:hover{background:var(--bg-hover)}
  .menu .tick{width:13px;flex-shrink:0;color:var(--accent)}
  .menu .hr{height:1px;background:var(--border);margin:4px 0}
  .menu .cap{padding:5px 11px 3px;font-size:11px;color:var(--text-faint)}

  .note{font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.6}
  .note b{color:var(--text-dim)}
  svg{display:block}
</style>

<header>
  <div>
    <h1>会话列表 · 显示模式</h1>
    <p class="lede">
      三种控制方式做出来对比。共同点:控制点都在<b>「最近」那一行的右端</b>,不占额外空间、不进设置页。
      差别在于 <b>换挡</b>(一个按钮循环)、<b>选档</b>(菜单选一档)、<b>自选</b>(逐项勾选)。
      每一栏都能真点,列表数据是同一份。
    </p>
  </div>
  <button onclick="document.documentElement.toggleAttribute('data-theme')">切换明暗</button>
</header>

<div class="board" id="board"></div>

<script>
const CHATS = [
  { id:"a", title:"修复活动栏滚动", dir:"~/Desktop/Triforge", live:true, unread:false,
    who:"助手", last:"已经改成三段式:标签区横向滚动,行末 ⋯ 不参与。图标模式下不再 flex-1,改固定 36px。", ago:"刚刚" },
  { id:"b", title:"组件显示开关", dir:"~/Desktop/Triforge", live:false, unread:true,
    who:"我", last:"组件tab 每个组件顶部应该是显示的开关 不要用个置顶", ago:"12 分钟前" },
  { id:"c", title:"从 Chrome 导入登录状态", dir:"~/Desktop/Triforge", live:false, unread:false,
    who:"助手", last:"钥匙串取密钥 → PBKDF2 → AES-128-CBC,连 WAL 一起拷到临时目录再只读打开。", ago:"14:20" },
  { id:"d", title:"iimos 平台基础设施", dir:"~/Desktop/iimos/platform", live:false, unread:false,
    who:"我", last:"先把 dl 和 api 的基础设施搭起来", ago:"昨天" },
  { id:"e", title:"克隆 wandesk-v2 仓库", dir:"~/Code/wandesk", live:false, unread:false,
    who:"助手", last:"克隆完成,依赖已装好。默认分支 main,最近一次提交是三天前。", ago:"周二" },
  { id:"f", title:"了解 Docker 的用途", dir:"~/Desktop", live:false, unread:false,
    who:"助手", last:"简单说,它把「跑起来需要的整套环境」打包成一个可移植的镜像。", ago:"8月24日" },
];

const I = {
  bot:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  folder:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>',
  tick:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  rows:(n)=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${
    n===1?'<path d="M4 7h16M4 12h16M4 17h16"/>':n===2?'<path d="M4 7h16M4 11h10M4 16h16M4 20h10"/>':'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/>'
  }</svg>`,
  slide:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="19" cy="18" r="2"/></svg>',
};

// 每一栏各自的状态
const state = {
  cycle: { mode: 1 },                                        // 0 紧凑 / 1 标准 / 2 宽松
  picker:{ mode: 1, open:false },
  fields:{ open:false, dir:true, last:true, time:true },
};

/** 一行:按「要显示哪些字段」渲染 —— 三种控制方式最终都归结到这组开关。 */
const rowHtml = (c, f, sel) => {
  const twoLine = f.last || f.dir;
  return `<div class="row ${sel?'sel':''}">
    ${I.bot}
    <div class="body">
      <div class="titleline">
        <span class="title">${c.title}</span>
        ${f.time ? `<span class="when">${c.ago}</span>` : ""}
      </div>
      ${f.dir && !f.bigSnippet ? `<div class="dir">${I.folder}${c.dir}</div>` : ""}
      ${f.last && !f.bigSnippet ? `<div class="sub"><span class="who">${c.who}:</span> ${c.last}</div>` : ""}
      ${f.bigSnippet ? `
        ${f.dir ? `<div class="dir">${I.folder}${c.dir}</div>` : ""}
        ${f.last ? `<div class="snippet"><span class="who">${c.who}:</span> ${c.last}</div>` : ""}` : ""}
    </div>
    ${c.live?'<span class="dot live"></span>':c.unread?'<span class="dot unread"></span>':''}
  </div>`;
};

const MODES = [
  { name:"紧凑", desc:"只有标题", fields:{} },
  { name:"标准", desc:"标题 + 时间 + 最后一句", fields:{ time:true, last:true } },
  { name:"宽松", desc:"全部:目录、两行摘要、时间", fields:{ time:true, last:true, dir:true, bigSnippet:true } },
];

const listHtml = (fields, headExtra) => `
  <div class="list">
    <div class="newrow">${I.plus}<span>新建对话</span></div>
    <div class="grouphead"><span>最近</span><span class="sp"></span>${headExtra}</div>
    ${CHATS.map((c,i)=>rowHtml(c, fields, i===0)).join("")}
  </div>`;

const shell = (inner) => `
  <div class="rail">
    <div class="rail-tabs"><span class="on">会话</span><span>文件</span><span>网站</span></div>
    ${inner}
  </div>`;

function render(){
  const board = document.getElementById("board");

  // ① 换挡:一个按钮,点一下换一档
  const cy = state.cycle.mode;
  const colA = `<div class="col">
    <h2>① 换挡按钮</h2>
    <p>点一下换下一档,图标就是当前密度。最省地方,零学习成本;缺点是要循环才能到想要的那档。</p>
    ${shell(listHtml(MODES[cy].fields,
      `<button class="gbtn on" data-act="cycle" title="显示模式:${MODES[cy].name}(点击切换)">${I.rows(cy+1)}</button>`))}
    <div class="note">当前:<b>${MODES[cy].name}</b> —— ${MODES[cy].desc}</div>
  </div>`;

  // ② 选档:菜单里挑一档
  const pk = state.picker.mode;
  const colB = `<div class="col">
    <h2>② 模式菜单</h2>
    <p>三档摊开来选,一步到位、当前档看得见。多一次点击,但不用猜下一档是什么。</p>
    ${shell(listHtml(MODES[pk].fields, `<span class="menuwrap">
      <button class="gbtn ${state.picker.open?'on':''}" data-act="picker-toggle" title="显示模式">${I.rows(pk+1)}</button>
      ${state.picker.open ? `<div class="menu">
        <div class="cap">显示模式</div>
        ${MODES.map((m,i)=>`<button data-act="picker-set" data-i="${i}">
          <span class="tick">${i===pk?I.tick:""}</span><span>${m.name}</span></button>`).join("")}
      </div>` : ""}
    </span>`))}
    <div class="note">当前:<b>${MODES[pk].name}</b> —— ${MODES[pk].desc}</div>
  </div>`;

  // ③ 自选:逐项勾选
  const f = state.fields;
  const ff = { dir:f.dir, last:f.last, time:f.time, bigSnippet:f.dir&&f.last };
  const colC = `<div class="col">
    <h2>③ 逐项勾选</h2>
    <p>每个字段单独开关,完全自定。最灵活,但要用户自己配 —— 而多数人只想要「多点/少点」。</p>
    ${shell(listHtml(ff, `<span class="menuwrap">
      <button class="gbtn ${state.fields.open?'on':''}" data-act="fields-toggle" title="显示哪些信息">${I.slide}</button>
      ${state.fields.open ? `<div class="menu">
        <div class="cap">每行显示</div>
        ${[["dir","所在目录"],["last","最后一条消息"],["time","时间"]].map(([k,label])=>`
          <button data-act="fields-set" data-k="${k}">
            <span class="tick">${f[k]?I.tick:""}</span><span>${label}</span></button>`).join("")}
      </div>` : ""}
    </span>`))}
    <div class="note">已开:<b>${[f.dir&&"目录",f.last&&"最后消息",f.time&&"时间"].filter(Boolean).join(" · ")||"只有标题"}</b></div>
  </div>`;

  board.innerHTML = colA + colB + colC;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  // 点空白关掉打开的菜单
  if (!el) {
    if (state.picker.open || state.fields.open) { state.picker.open = state.fields.open = false; render(); }
    return;
  }
  const act = el.dataset.act;
  if (act === "cycle") state.cycle.mode = (state.cycle.mode + 1) % MODES.length;
  if (act === "picker-toggle") { state.picker.open = !state.picker.open; state.fields.open = false; }
  if (act === "picker-set") { state.picker.mode = Number(el.dataset.i); state.picker.open = false; }
  if (act === "fields-toggle") { state.fields.open = !state.fields.open; state.picker.open = false; }
  if (act === "fields-set") state.fields[el.dataset.k] = !state.fields[el.dataset.k];
  render();
});

render();
</script>

<!doctype html>
<meta charset="utf-8">
<title>快速问答</title>
<link rel="stylesheet" href="./style.css">
<div class="wrap chat">
  <div class="head"><button id="clear" class="ghost btn small" hidden>清空</button></div>
  <div id="log" class="log"><div class="empty">例如:cron 的五个位置什么意思?</div></div>
  <form id="form" class="composer">
    <textarea id="text" rows="1" placeholder="问点什么…(Enter 发送)"></textarea>
    <button id="send" class="btn">发送</button>
  </form>
</div>
<script type="module" src="./main.js"></script>

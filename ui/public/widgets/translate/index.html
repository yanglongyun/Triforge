<!doctype html>
<meta charset="utf-8">
<title>翻译</title>
<link rel="stylesheet" href="./style.css">
<div class="wrap">
  <div class="seg" id="seg">
    <button data-lang="中文" class="on">译成中文</button>
    <button data-lang="英文">English</button>
    <button data-lang="日文">日本語</button>
  </div>
  <textarea id="src" rows="5" placeholder="贴要翻的文字…(⌘/Ctrl+Enter 翻译)"></textarea>
  <button id="go" class="btn">翻译</button>
  <div id="outcard" class="card out" hidden>
    <div id="out"></div>
    <button id="copy" class="ghost btn small">复制</button>
  </div>
</div>
<script type="module" src="./main.js"></script>

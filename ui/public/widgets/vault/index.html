<!doctype html>
<meta charset="utf-8">
<title>密码库</title>
<link rel="stylesheet" href="./style.css">
<div class="wrap">
  <div class="top">
    <input id="q" type="search" placeholder="搜索名称 / 网址 / 账号…" autocomplete="off">
    <button id="add" class="iconbtn" title="新增一条">＋</button>
    <button id="more" class="iconbtn" title="导入 / 导出 / 清空">⋯</button>
  </div>
  <div id="menu" class="menu" hidden>
    <button id="import" class="mi">导入 CSV…</button>
    <button id="export" class="mi">导出 CSV(复制到剪贴板)</button>
    <button id="download" class="mi">导出 CSV(下载文件)</button>
    <div class="msep"></div>
    <button id="clear" class="mi danger">清空全部</button>
  </div>
  <input id="file" type="file" accept=".csv,text/csv" hidden>

  <div id="editor" class="card editor" hidden>
    <div class="ehead"><b id="etitle">新增</b><button id="ecancel" class="iconbtn" title="取消">✕</button></div>
    <label><span>名称</span><input id="ename" type="text" placeholder="例如 GitHub"></label>
    <label><span>网址</span><input id="eurl" type="text" placeholder="https://…"></label>
    <label><span>账号</span><input id="euser" type="text" autocomplete="off"></label>
    <label><span>密码</span><div class="pwfield"><input id="epass" type="password" autocomplete="new-password"><button id="etoggle" class="iconbtn" title="显示 / 隐藏">👁</button></div></label>
    <label><span>备注</span><textarea id="enote" rows="2"></textarea></label>
    <div class="eactions"><button id="esave" class="btn">保存</button><button id="edelete" class="ghost btn danger" hidden>删除</button></div>
  </div>

  <div id="count" class="dim small"></div>
  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>还没有密码。点右上角 ⋯ 导入 CSV,或 ＋ 手动加一条。</div>
</div>
<script type="module" src="./main.js"></script>

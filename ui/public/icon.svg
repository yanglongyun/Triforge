<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Worktop 图标(0.4.0 改名定稿):沿用双色基因(绿→蓝对角渐变 = 自然×智能),
       白色版面 = 工作台本身 —— 侧栏 + 主窗格 + 分屏窗格,agent 与人共用的那张桌子。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1ea86c"/>
      <stop offset="1" stop-color="#2f7ff0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.18)"/>
      <stop offset=".5" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#sheen)"/>

  <!-- 侧栏:会话列表(三个小节点,最上面那个是活着的对话) -->
  <rect x="264" y="308" width="112" height="408" rx="40" fill="#ffffff"/>
  <circle cx="320" cy="384" r="26" fill="#1ea86c" opacity=".85"/>
  <rect x="298" y="452" width="44" height="18" rx="9" fill="rgba(30,150,110,.35)"/>
  <rect x="298" y="502" width="44" height="18" rx="9" fill="rgba(30,150,110,.35)"/>

  <!-- 主窗格:对话/文档 -->
  <rect x="420" y="308" width="340" height="240" rx="40" fill="#ffffff"/>
  <rect x="464" y="366" width="196" height="20" rx="10" fill="rgba(47,127,240,.4)"/>
  <rect x="464" y="416" width="252" height="20" rx="10" fill="rgba(47,127,240,.28)"/>
  <rect x="464" y="466" width="152" height="20" rx="10" fill="rgba(47,127,240,.28)"/>

  <!-- 分屏窗格:agent 正在操作的那半张桌子 -->
  <rect x="420" y="592" width="340" height="124" rx="40" fill="#ffffff" opacity=".88"/>
</svg>

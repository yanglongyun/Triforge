<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务</title>
<style>
  :root {
    --color-bg-raised:#fbfbfa; --color-bg-inset:#f1f1ef; --color-bg-hover:#efefed;
    --color-border:#ebebea; --color-border-strong:#d3d3d1;
    --color-text:#37352f; --color-text-dim:#5f5e5b; --color-text-faint:#9b9a97;
    --color-accent:#2383e2; --color-surface:#ffffff; --color-danger:#e03e3e;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; color:var(--color-text); background:var(--color-bg-raised);
    -webkit-font-smoothing:antialiased; overflow-y:auto; overflow-x:hidden;
  }
  button { font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }

  .add { padding:8px 8px 4px; }
  .add input {
    width:100%; height:28px; padding:0 9px; font:inherit; font-size:13px; color:var(--color-text);
    background:var(--color-bg-inset); border:none; border-radius:5px; outline:none;
  }
  .add input:focus { box-shadow:0 0 0 1.5px var(--color-accent) inset; background:var(--color-surface); }
  .add input::placeholder { color:var(--color-text-faint); }

  .row { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 12px; cursor:pointer; user-select:none; }
  .row:hover { background:var(--color-bg-hover); }
  .ck {
    width:14px; height:14px; flex-shrink:0; border:1.5px solid var(--color-border-strong);
    border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px;
  }
  .row.done .ck { background:var(--color-accent); border-color:var(--color-accent); }
  .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.done .t { text-decoration:line-through; color:var(--color-text-faint); }
  .del { flex-shrink:0; width:18px; height:18px; border-radius:4px; color:var(--color-text-faint); opacity:0; font-size:13px; }
  .row:hover .del { opacity:1; }
  .del:hover { color:var(--color-danger); background:var(--color-bg-inset); }
  .empty { padding:40px 20px; text-align:center; font-size:12.5px; color:var(--color-text-faint); line-height:1.7; }
</style>
</head>
<body>
<div class="add"><input id="input" placeholder="添加任务,Enter 记入" spellcheck="false"></div>
<div id="list"></div>
<script src="../workbench-sdk.js"></script>
<script>
"use strict";
/* 「任务」面板 —— 从面板库安装的扩展面板示例:整个功能就是这一页 HTML,
   数据放自己的 storage,与宿主的全部往来只有 workbench-sdk。 */
const $list = document.getElementById("list");
const $input = document.getElementById("input");
let items = [];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const save = () => workbench.storage.set({ items });

const render = () => {
  if (!items.length) {
    $list.innerHTML = '<div class="empty">还没有任务。<br>上面输入,Enter 记入。</div>';
    return;
  }
  $list.innerHTML = items.map((it, i) =>
    '<div class="row' + (it.done ? " done" : "") + '" data-i="' + i + '">' +
      '<span class="ck">' + (it.done ? "✓" : "") + "</span>" +
      '<span class="t">' + esc(it.text) + "</span>" +
      '<button class="del" data-del="' + i + '">✕</button>' +
    "</div>",
  ).join("");
};

$input.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const text = $input.value.trim();
  if (!text) return;
  items.unshift({ text, done: false, created_at: new Date().toISOString() });
  $input.value = "";
  save();
  render();
});
$list.addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { items.splice(Number(del.dataset.del), 1); save(); render(); return; }
  const row = e.target.closest("[data-i]");
  if (row) { const it = items[Number(row.dataset.i)]; if (it) { it.done = !it.done; save(); render(); } }
});

workbench.ready().then(async () => {
  const data = await workbench.storage.get().catch(() => null);
  items = Array.isArray(data?.items) ? data.items : [];
  render();
});
render();
</script>
</body>
</html>

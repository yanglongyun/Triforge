<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计数器</title>
<style>
  :root {
    --color-bg:#ffffff; --color-bg-inset:#f1f1ef; --color-border:#ebebea;
    --color-text:#37352f; --color-text-faint:#9b9a97; --color-accent:#2383e2; --color-surface:#ffffff;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    background:var(--color-bg); color:var(--color-text);
    display:flex; align-items:center; justify-content:center;
  }
  .card { text-align:center; max-width:420px; padding:24px; }
  .n { font-size:88px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .btn {
    font:inherit; cursor:pointer; border:none; margin:14px 6px 0;
    padding:10px 22px; border-radius:10px; background:var(--color-accent); color:#fff; font-size:15px;
  }
  .btn.ghost { background:var(--color-bg-inset); color:var(--color-text); }
  .meta { margin-top:18px; font-size:12px; color:var(--color-text-faint); line-height:1.7; }
  .meta code { background:var(--color-bg-inset); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="card">
  <div class="n" id="n">…</div>
  <button class="btn" id="inc">+1</button>
  <button class="btn ghost" id="where">它在哪跑?</button>
  <div class="meta" id="meta">
    前端只有这颗按钮 —— 计数逻辑与持久化在 <code>server.js</code>(workerd 沙箱)里,<br>
    经 <code>workbench.gadget.increment()</code> 直连。重启 Workbench 数字不丢。
  </div>
</div>
<script src="/apps/workbench-sdk.js"></script>
<script>
  const $n = document.getElementById("n");
  const $meta = document.getElementById("meta");
  const show = (v) => { $n.textContent = v; };
  workbench.ready().then(async () => {
    try { show(await workbench.gadget.get()); }
    catch (e) { show("!"); $meta.textContent = "后端不可用:" + e.message; }
  });
  document.getElementById("inc").onclick = async () => {
    try { show(await workbench.gadget.increment(1)); }
    catch (e) { workbench.ui.toast("失败:" + e.message); }
  };
  document.getElementById("where").onclick = async () => {
    try {
      const w = await workbench.gadget.whereAmI();
      workbench.ui.toast(w.runtime + " · " + w.net);
    } catch (e) { workbench.ui.toast("失败:" + e.message); }
  };
</script>
</body>
</html>

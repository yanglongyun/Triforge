<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>任务</title>
<link rel="stylesheet" href="/style.css">
<style>.ck{width:15px;height:15px;flex-shrink:0;border:1.5px solid var(--color-border-strong);border-radius:4px;
display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.done .ck{background:var(--color-accent);border-color:var(--color-accent)}
.done .t{text-decoration:line-through;color:var(--color-text-faint)}</style>
</head><body>
<div class="wrap">
  <div class="bar"><input id="text" placeholder="添加任务,回车记入" spellcheck="false"></div>
  <div id="list"></div>
</div>
<script>
const $list = document.getElementById("list"), $text = document.getElementById("text");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const load = async () => {
  const todos = await (await fetch("/api/todos")).json();
  $list.innerHTML = todos.length ? todos.map((t) => `
    <div class="row ${t.done ? "done" : ""}" data-id="${t.id}" data-done="${t.done}">
      <span class="ck">${t.done ? "✓" : ""}</span><span class="t">${esc(t.text)}</span>
      <button class="del" data-del="${t.id}">✕</button></div>`).join("")
    : `<div class="empty">还没有任务。<br>上面输入,回车记入。</div>`;
};
$text.onkeydown = async (e) => {
  if (e.key !== "Enter") return;
  const text = $text.value.trim(); if (!text) return;
  await fetch("/api/todos", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
  $text.value = ""; load();
};
$list.onclick = async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { await fetch(`/api/todos?id=${del.dataset.del}`, { method: "DELETE" }); load(); return; }
  const row = e.target.closest("[data-id]");
  if (!row) return;
  await fetch("/api/todos", { method: "PATCH", headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: Number(row.dataset.id), done: row.dataset.done === "0" }) });
  load();
};
load();
</script></body></html>

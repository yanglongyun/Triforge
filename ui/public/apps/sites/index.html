<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站</title>
<style>
  /* token 由宿主注入(--color-*);这里只给兜底值(浅色),暗色随宿主实时翻转 */
  :root {
    --color-bg-raised:#fbfbfa; --color-bg-inset:#f1f1ef; --color-bg-hover:#efefed;
    --color-border:#ebebea; --color-border-strong:#d3d3d1;
    --color-text:#37352f; --color-text-dim:#5f5e5b; --color-text-faint:#9b9a97;
    --color-accent:#2383e2; --color-accent-soft:#e7f0f9;
    --color-danger:#e03e3e; --color-surface:#ffffff;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14.5px; color:var(--color-text); background:var(--color-bg-raised);
    -webkit-font-smoothing:antialiased; overflow-y:auto; overflow-x:hidden;
  }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:transparent; border-radius:8px; }
  body:hover::-webkit-scrollbar-thumb { background:var(--color-border-strong); }
  button { font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  input { font:inherit; color:var(--color-text); }

  #list { padding:4px 0; }
  .row {
    display:flex; align-items:center; gap:6px; padding:4px 8px 4px 12px;
    cursor:pointer; user-select:none;
  }
  .row:hover { background:var(--color-bg-hover); }
  .row .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.action { color:var(--color-text-faint); font-size:13.5px; }
  .row.action:hover { color:var(--color-text); }
  .row input {
    flex:1; min-width:0; background:var(--color-surface); border:1px solid var(--color-accent);
    border-radius:4px; padding:1px 4px; margin:-1px 0; font-size:13.5px; outline:none;
  }
  .row input.mono { font-family:"JetBrains Mono","SF Mono",Menlo,monospace; font-size:12.5px; }
  .row input::placeholder { color:var(--color-text-faint); font-family:inherit; }
  .fav { width:14px; height:14px; flex-shrink:0; border-radius:3px; }
  .fav-letter {
    width:14px; height:14px; flex-shrink:0; border-radius:3px; color:#fff;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .more {
    flex-shrink:0; width:20px; height:20px; border-radius:4px; display:flex; align-items:center;
    justify-content:center; color:var(--color-text-faint); opacity:0; font-size:15px; line-height:1;
  }
  .row:hover .more { opacity:1; }
  .more:hover { color:var(--color-text); background:var(--color-bg-inset); }
  .plus { width:14px; text-align:center; flex-shrink:0; font-size:14px; line-height:1; }

  .empty { display:flex; flex-direction:column; align-items:center; gap:12px; padding:64px 24px; text-align:center; }
  .empty .g { font-size:26px; opacity:.7; }
  .empty .d { font-size:13px; color:var(--color-text-faint); line-height:1.6; }
  .empty button.cta {
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:6px;
    background:var(--color-accent); color:#fff; font-size:13px;
  }

  #menu {
    position:fixed; z-index:50; min-width:150px; background:var(--color-surface);
    border:1px solid var(--color-border); border-radius:8px; padding:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.13); font-size:13px;
  }
  #menu button { display:flex; width:100%; text-align:left; padding:5px 10px; border-radius:5px; }
  #menu button:hover { background:var(--color-bg-hover); }
  #menu button.danger { color:var(--color-danger); }
  #menu .div { height:1px; background:var(--color-border); margin:4px 6px; }
</style>
</head>
<body>
<div id="list"></div>
<div id="menu" hidden></div>
<script src="../workbench-sdk.js"></script>
<script>
"use strict";
/* 「网站」面板 —— 预置的 iframe 面板示例(吃自己狗粮):
   书签数据归面板私有(workbench.storage),打开动作走宿主(workbench.tabs.open,
   同站去重聚焦在宿主侧);除此之外的一切 —— 列表、添加、改名、改址、菜单 —— 都是
   面板自己的事,宿主一概不知情。 */
const $list = document.getElementById("list");
const $menu = document.getElementById("menu");
let sites = [];
let adding = false;
let editing = null;   // { id, field: "title" | "url" }

/* ── URL 口径(与宿主同款):无协议补 https;身份键 = 主机去 www 小写 ── */
const parseUrl = (raw) => {
  const v = String(raw || "").trim();
  if (!v) return null;
  try { return new URL(/^[a-z][a-z0-9+.-]*:/i.test(v) ? v : "https://" + v); } catch { return null; }
};
const normalizeUrl = (raw) => {
  const u = parseUrl(raw);
  if (!u || !/^https?:$/.test(u.protocol)) return null;
  return u.toString();
};
const siteKey = (url) => {
  const u = parseUrl(url);
  return u ? u.hostname.toLowerCase().replace(/^www\./, "") + (u.port ? ":" + u.port : "") : "";
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const FAV_COLORS = ["#2383e2","#0f7b6c","#cb6b16","#9065b0","#e03e3e","#3d7a8c"];
const favHtml = (url) => {
  const host = siteKey(url) || "?";
  const color = FAV_COLORS[[...host].reduce((a,c)=>a+c.charCodeAt(0),0) % FAV_COLORS.length];
  const letter = esc((host[0] || "?").toUpperCase());
  /* 宿主同款三级兜底:页面图标由 /api/favicon 代理抓取,失败换字母牌 */
  return '<img class="fav" src="/api/favicon?url=' + encodeURIComponent(url) + '" alt="" ' +
    'onerror="this.outerHTML=\'<span class=&quot;fav-letter&quot; style=&quot;background:' + color + '&quot;>' + letter + '</span>\'">';
};

const save = () => workbench.storage.set({ sites });

/* ── 渲染 ── */
const render = () => {
  closeMenu();
  let html = "";
  if (adding) {
    html += '<div class="row"><span class="plus" style="color:var(--color-accent)">+</span>' +
      '<input id="add-input" class="mono" placeholder="输入网址,回车打开…" spellcheck="false"></div>';
  } else {
    html += '<div class="row action" data-add><span class="plus">+</span><span class="t">添加网站</span></div>';
  }
  for (const s of sites) {
    if (editing && editing.id === s.id) {
      const isUrl = editing.field === "url";
      html += '<div class="row">' + favHtml(s.url) +
        '<input id="edit-input" class="' + (isUrl ? "mono" : "") + '" value="' + esc(isUrl ? s.url : s.title) + '" spellcheck="false"></div>';
    } else {
      html += '<div class="row" data-id="' + esc(s.id) + '" title="' + esc(s.url) + '">' + favHtml(s.url) +
        '<span class="t">' + esc(s.title) + '</span><button class="more" data-more="' + esc(s.id) + '">⋯</button></div>';
    }
  }
  if (!sites.length && !adding) {
    html = '<div class="empty"><div class="g">🌐</div>' +
      '<div class="d">还没有收藏的网站。<br>网页在标签页里打开,登录态保留在本机。</div>' +
      '<button class="cta" data-add>+ 添加网站</button></div>';
  }
  $list.innerHTML = html;

  const addInput = document.getElementById("add-input");
  if (addInput) {
    addInput.focus();
    addInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { adding = false; render(); }
      if (e.key === "Enter") commitAdd(addInput.value);
    });
    addInput.addEventListener("blur", () => commitAdd(addInput.value));
  }
  const editInput = document.getElementById("edit-input");
  if (editInput) {
    editInput.focus();
    editInput.select();
    editInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { editing = null; render(); }
      if (e.key === "Enter") commitEdit(editInput.value);
    });
    editInput.addEventListener("blur", () => commitEdit(editInput.value));
  }
};

/* ── 动作 ── */
const commitAdd = (raw) => {
  if (!adding) return;
  adding = false;
  const url = normalizeUrl(raw);
  if (!url) { render(); return; }
  const key = siteKey(url);
  let site = sites.find((s) => siteKey(s.url) === key); // 同站已收藏:复用,不重复插
  if (!site) {
    site = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)),
      title: (parseUrl(url)?.hostname || url).replace(/^www\./, ""),
      url,
      created_at: new Date().toISOString(),
    };
    sites.unshift(site);
    save();
  }
  render();
  workbench.tabs.open({ kind: "web", url: site.url, title: site.title }); // 存下即打开
};

const commitEdit = (raw) => {
  if (!editing) return;
  const { id, field } = editing;
  editing = null;
  const site = sites.find((s) => s.id === id);
  const value = String(raw || "").trim();
  if (site && value) {
    if (field === "title") site.title = value;
    else {
      const url = normalizeUrl(value);
      if (url) site.url = url;
    }
    save();
  }
  render();
};

const removeSite = async (site) => {
  const ok = await workbench.dialog.confirm("从网站列表删除「" + site.title + "」?", { danger: true, confirmText: "删除" });
  if (!ok) return;
  sites = sites.filter((s) => s.id !== site.id);
  save();
  render();
};

/* ── 菜单(面板内部的事,自己画)── */
const closeMenu = () => { $menu.hidden = true; $menu.innerHTML = ""; };
const openMenu = (site, x, y) => {
  $menu.innerHTML =
    '<button data-act="rename">重命名</button>' +
    '<button data-act="editurl">修改网址</button>' +
    '<button data-act="copy">复制链接</button>' +
    '<button data-act="external">在系统浏览器打开</button>' +
    '<div class="div"></div>' +
    '<button class="danger" data-act="remove">删除</button>';
  $menu.hidden = false;
  const w = $menu.offsetWidth, h = $menu.offsetHeight;
  $menu.style.left = Math.max(4, Math.min(x, innerWidth - w - 4)) + "px";
  $menu.style.top = Math.max(4, Math.min(y, innerHeight - h - 4)) + "px";
  $menu.onclick = (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    closeMenu();
    if (act === "rename") { editing = { id: site.id, field: "title" }; render(); }
    if (act === "editurl") { editing = { id: site.id, field: "url" }; render(); }
    if (act === "copy") workbench.system.copyText(site.url);
    if (act === "external") workbench.system.openExternal(site.url);
    if (act === "remove") removeSite(site);
  };
};

/* ── 事件 ── */
$list.addEventListener("click", (e) => {
  if (e.target.closest("[data-add]")) { adding = true; render(); return; }
  const more = e.target.closest("[data-more]");
  if (more) {
    const site = sites.find((s) => s.id === more.dataset.more);
    if (site) { const r = more.getBoundingClientRect(); openMenu(site, r.left - 120, r.bottom + 4); }
    return;
  }
  const row = e.target.closest("[data-id]");
  if (row) {
    const site = sites.find((s) => s.id === row.dataset.id);
    if (site) workbench.tabs.open({ kind: "web", url: site.url, title: site.title });
  }
});
$list.addEventListener("contextmenu", (e) => {
  const row = e.target.closest("[data-id]");
  if (!row) return;
  e.preventDefault();
  const site = sites.find((s) => s.id === row.dataset.id);
  if (site) openMenu(site, e.clientX, e.clientY);
});
document.addEventListener("pointerdown", (e) => { if (!$menu.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

/* ── 启动:等宿主握手,取回自己的数据 ── */
workbench.ready().then(async () => {
  const data = await workbench.storage.get().catch(() => null);
  sites = Array.isArray(data?.sites) ? data.sites : [];
  render();
});
render(); // 先画空壳(添加行),数据到了重画
</script>
</body>
</html>

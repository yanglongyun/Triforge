<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>网站</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="wrap">
  <div class="bar">
    <input id="url" placeholder="输入网址,回车收藏" spellcheck="false">
    <button id="add">收藏</button>
  </div>
  <div id="list"></div>
</div>
<script src="/_wb/sdk.js"></script>
<script>
const $list = document.getElementById("list"), $url = document.getElementById("url");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const load = async () => {
  const sites = await (await fetch("/api/sites")).json();
  $list.innerHTML = sites.length ? sites.map((s) => `
    <div class="row" data-url="${esc(s.url)}">
      <span class="t">${esc(s.title)}</span>
      <span class="sub">${esc(s.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span>
      <button class="del" data-del="${s.id}">✕</button>
    </div>`).join("")
    : `<div class="empty">还没有收藏的网站。<br>上面输入网址,回车收藏。</div>`;
};
const add = async () => {
  const url = $url.value.trim(); if (!url) return;
  const r = await fetch("/api/sites", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }) });
  if (!r.ok) { workbench.ui.toast("网址不合法"); return; }
  $url.value = ""; load();
};
document.getElementById("add").onclick = add;
$url.onkeydown = (e) => { if (e.key === "Enter") add(); };
$list.onclick = async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { await fetch(`/api/sites?id=${del.dataset.del}`, { method: "DELETE" }); load(); return; }
  const row = e.target.closest("[data-url]");
  if (row) workbench.tabs.open({ url: row.dataset.url });
};
load();
</script></body></html>

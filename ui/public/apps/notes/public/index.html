<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>笔记</title>
<link rel="stylesheet" href="/style.css">
<style>.card{padding:10px 12px;border-bottom:1px solid var(--color-border);white-space:pre-wrap;position:relative}
.card:hover{background:var(--color-bg-hover)}.card .del{position:absolute;right:8px;top:8px;opacity:0}
.card:hover .del{opacity:1}
.sum{margin:12px;padding:12px 14px;border-radius:10px;background:var(--color-bg-inset);
white-space:pre-wrap;font-size:13.5px;line-height:1.7}
.sum h4{font-size:12px;color:var(--color-text-faint);font-weight:600;margin-bottom:6px}
.ghost{background:var(--color-bg-inset);color:var(--color-text)}</style>
</head><body>
<div class="wrap">
  <div class="bar">
    <input id="text" placeholder="记点什么,回车保存" spellcheck="false">
    <button id="sum" class="ghost">AI 整理</button>
  </div>
  <div id="summary"></div>
  <div id="list"></div>
</div>
<script src="/_wb/sdk.js"></script>
<script>
const $list = document.getElementById("list"), $text = document.getElementById("text"), $sum = document.getElementById("summary");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const load = async () => {
  const notes = await (await fetch("/api/notes")).json();
  $list.innerHTML = notes.length ? notes.map((n) => `
    <div class="card">${esc(n.text)}<button class="del" data-del="${n.id}">✕</button></div>`).join("")
    : `<div class="empty">还没有笔记。<br>上面输入,回车保存;攒几条后点「AI 整理」。</div>`;
};
$text.onkeydown = async (e) => {
  if (e.key !== "Enter") return;
  const text = $text.value.trim(); if (!text) return;
  await fetch("/api/notes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
  $text.value = ""; load();
};
$list.onclick = async (e) => {
  const del = e.target.closest("[data-del]");
  if (!del) return;
  await fetch(`/api/notes?id=${del.dataset.del}`, { method: "DELETE" }); load();
};
document.getElementById("sum").onclick = async () => {
  $sum.innerHTML = `<div class="sum">AI 整理中…(在「活动」面板能看到这次调用)</div>`;
  const r = await fetch("/api/summarize", { method: "POST" });
  const d = await r.json();
  $sum.innerHTML = r.ok
    ? `<div class="sum"><h4>AI 整理 · ${d.tokens || 0} tokens</h4>${esc(d.text)}</div>`
    : `<div class="sum">失败:${esc(d.error || "未知错误")}</div>`;
};
load();
</script></body></html>
